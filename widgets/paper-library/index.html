<script type="application/json" id="explorer-data">{"kind":"papers","data":{"status":"研究简报／预印本草案，未同行评议","papers":[{"id":"01","folder":"01_乙酰唑胺跨库证据链","file":"01_乙酰唑胺跨库证据链.md","title":"乙酰唑胺—碳酸酐酶 II 的跨库证据链","status":"研究简报／预印本草案，未同行评议","characters":9611,"figures":[{"filename":"fig01a_sequence_identity.png","src":"../../assets/papers/01_乙酰唑胺跨库证据链/fig01a_sequence_identity.png","alt":"fig01a sequence identity"},{"filename":"fig01b_activity_pchembl.png","src":"../../assets/papers/01_乙酰唑胺跨库证据链/fig01b_activity_pchembl.png","alt":"fig01b activity pchembl"},{"filename":"fig01c_evidence_chain.png","src":"../../assets/papers/01_乙酰唑胺跨库证据链/fig01c_evidence_chain.png","alt":"fig01c evidence chain"},{"filename":"fig01d_descriptor_audit.png","src":"../../assets/papers/01_乙酰唑胺跨库证据链/fig01d_descriptor_audit.png","alt":"fig01d descriptor audit"},{"filename":"fig01e_structural_control.png","src":"../../assets/papers/01_乙酰唑胺跨库证据链/fig01e_structural_control.png","alt":"fig01e structural control"}],"figureFiles":["fig01a_sequence_identity.png","fig01b_activity_pchembl.png","fig01c_evidence_chain.png","fig01d_descriptor_audit.png","fig01e_structural_control.png"],"pipelineId":"d504fd42-1eb2-4560-909f-b4243998a8c8","sha256":"0f0de6cf34c91a8cd45051968f0c198e9ad41321205b347c4c65d98755181096","sections":[{"id":"01-section-0","title":"乙酰唑胺—碳酸酐酶 II 的跨库证据链","level":1,"text":"An Auditable Cross-Database Evidence Chain from Acetazolamide to Human Carbonic anhydrase II --- 作者 千界花园学术系统 单位 千界花园学术系统 · 前沿共生计划 日期 2026年10月 分类 化学信息学 · 结构生物学 · 跨库复核 · 研究简报／预印本草案（未同行评议） 文档血缘 千界花园流水线初稿，经数值、来源与边界核验修订 ---","html":"<h2><strong>An Auditable Cross-Database Evidence Chain from Acetazolamide to Human Carbonic anhydrase II<\/strong><\/h2>\n<blockquote>\n<p><strong>作者<\/strong> | 千界花园学术系统\n<strong>单位<\/strong> | 千界花园学术系统 · 前沿共生计划\n<strong>日期<\/strong> | 2026年10月\n<strong>分类<\/strong> | 化学信息学 · 结构生物学 · 跨库复核 · 研究简报／预印本草案（未同行评议）\n<strong>文档血缘<\/strong> | 千界花园流水线初稿，经数值、来源与边界核验修订<\/p>\n<\/blockquote>\n<hr>\n"},{"id":"01-section-1","title":"摘要","level":2,"text":"本简报对\"乙酰唑胺（acetazolamide, AZM）—人碳酸酐酶 II（carbonic anhydrase II, CA II）\"这一药理学关系在四个公开数据库（ChEMBL、PubChem、UniProtKB、RCSB PDB）之间进行逐层身份核验与证据分级。证据链由四层构成：(i) 化合物身份层——PubChem CID 1986 与 ChEMBL20 条目指向同一化学实体；(ii) 靶点身份层——ChEMBL205 与 UniProtKB P00918 指向同一蛋白；(iii) 结构层——PDB 3HS4 entity 1 的 260 个氨基酸序列与 P00918 序列逐字符一致，分辨率达 1.1 Å，且该结构含 AZM 配体（entity 4）；(iv) 活性层——选定的 Ki 测定（CHEMBL657848）为 12 nM，对应 pChEMBL 重算值 7.920818753952375，但携带 potential duplicate=1 审计警告，予以保留而非删除。我们明确指出：单一 Ki 值不构成对 AZM 统一抑制效力的推断，亦不构成任何临床效力的结论； potential duplicate=1 是审计提示而非造假证据。本工作属于 数据库复核与本地计算 ，不构成独立实验复现。 关键词 ：乙酰唑胺；碳酸酐酶 II；ChEMBL；PDB 3HS4；数据核型；证据链审计 ---","html":"<p>本简报对&quot;乙酰唑胺（acetazolamide, AZM）—人碳酸酐酶 II（carbonic anhydrase II, CA II）&quot;这一药理学关系在四个公开数据库（ChEMBL、PubChem、UniProtKB、RCSB PDB）之间进行逐层身份核验与证据分级。证据链由四层构成：(i) 化合物身份层——PubChem CID 1986 与 ChEMBL20 条目指向同一化学实体；(ii) 靶点身份层——ChEMBL205 与 UniProtKB P00918 指向同一蛋白；(iii) 结构层——PDB 3HS4 entity 1 的 260 个氨基酸序列与 P00918 序列逐字符一致，分辨率达 1.1 Å，且该结构含 AZM 配体（entity 4）；(iv) 活性层——选定的 Ki 测定（CHEMBL657848）为 12 nM，对应 pChEMBL 重算值 7.920818753952375，但携带 <code>potential_duplicate=1<\/code> 审计警告，予以保留而非删除。我们明确指出：单一 Ki 值不构成对 AZM 统一抑制效力的推断，亦不构成任何临床效力的结论；<code>potential_duplicate=1<\/code> 是审计提示而非造假证据。本工作属于<strong>数据库复核与本地计算<\/strong>，不构成独立实验复现。<\/p>\n<p><strong>关键词<\/strong>：乙酰唑胺；碳酸酐酶 II；ChEMBL；PDB 3HS4；数据核型；证据链审计<\/p>\n<hr>\n"},{"id":"01-section-2","title":"1.1 问题背景","level":3,"text":"乙酰唑胺是经典碳酸酐酶抑制剂，其与 CA II 的相互作用是药物化学教学与研究中的基准体系。然而，在开放数据时代，该\"常识性\"关系的数据载体分布于多个异构数据库中，每一层身份（化合物、靶点、序列、结构、活性记录）都可能在跨库映射中发生漂移。一条完整的、可逐层复核的证据链，是任何下游定量分析（QSAR、对接基准、机器学习训练集构造）合法性的前提。","html":"<p>乙酰唑胺是经典碳酸酐酶抑制剂，其与 CA II 的相互作用是药物化学教学与研究中的基准体系。然而，在开放数据时代，该&quot;常识性&quot;关系的数据载体分布于多个异构数据库中，每一层身份（化合物、靶点、序列、结构、活性记录）都可能在跨库映射中发生漂移。一条完整的、可逐层复核的证据链，是任何下游定量分析（QSAR、对接基准、机器学习训练集构造）合法性的前提。<\/p>\n"},{"id":"01-section-3","title":"1.2 本工作的定位","level":3,"text":"本文将“数据核型”作为内部工作术语，指对既有开放数据进行逐层身份核验、结构证据确认与活性边界划定；它不表示一个既有独立学科分类。本文不生成新实验数据，也明确 不是 实验复现；所有数值均可溯源至指定数据库条目与本地计算。","html":"<p>本文将“数据核型”作为内部工作术语，指对既有开放数据进行逐层身份核验、结构证据确认与活性边界划定；它不表示一个既有独立学科分类。本文不生成新实验数据，也明确<strong>不是<\/strong>实验复现；所有数值均可溯源至指定数据库条目与本地计算。<\/p>\n"},{"id":"01-section-4","title":"1.3 相关工作与已知结果","level":3,"text":"3HS4 的原始论文报告了人 CA II 与乙酰唑胺的高分辨率复合物；ChEMBL 则提供化合物、靶点、策划机制和具体活性测量。本文只使用这些可回查记录，不以“教科书共识”代替数据审计，也不把选定 assay 的数值当成全部文献的唯一值。","html":"<p>3HS4 的原始论文报告了人 CA II 与乙酰唑胺的高分辨率复合物；ChEMBL 则提供化合物、靶点、策划机制和具体活性测量。本文只使用这些可回查记录，不以“教科书共识”代替数据审计，也不把选定 assay 的数值当成全部文献的唯一值。<\/p>\n"},{"id":"01-section-5","title":"1.4 本文的研究动机与内容安排","level":3,"text":"命题 1（证据链完整性） ：CHEMBL20／PubChem 1986 的化合物身份、CHEMBL205／P00918 的靶点、3HS4 entity 1 的 260 aa 序列与 AZM 配体，可在四个数据库之间逐层复核（layer-by-layer verifiable）。 命题 2（活性记录的边界性） ：CHEMBL657848 的 Ki = 12 nM 仅描述该单一 assay；它不能外推为 AZM 的统一效力，更不能外推为临床结论。 命题 3（审计警告的中性解释） ： potential duplicate=1 是 ChEMBL 数据管道输出的审计警告，其含义为\"该记录可能与其他记录重复\"，在缺乏进一步证据时既不得作为剔除理由，也不得作为造假证据。 ---","html":"<blockquote>\n<p><strong>命题 1（证据链完整性）<\/strong>：CHEMBL20／PubChem 1986 的化合物身份、CHEMBL205／P00918 的靶点、3HS4 entity 1 的 260 aa 序列与 AZM 配体，可在四个数据库之间逐层复核（layer-by-layer verifiable）。<\/p>\n<\/blockquote>\n<blockquote>\n<p><strong>命题 2（活性记录的边界性）<\/strong>：CHEMBL657848 的 Ki = 12 nM 仅描述该单一 assay；它不能外推为 AZM 的统一效力，更不能外推为临床结论。<\/p>\n<\/blockquote>\n<blockquote>\n<p><strong>命题 3（审计警告的中性解释）<\/strong>：<code>potential_duplicate=1<\/code> 是 ChEMBL 数据管道输出的审计警告，其含义为&quot;该记录可能与其他记录重复&quot;，在缺乏进一步证据时既不得作为剔除理由，也不得作为造假证据。<\/p>\n<\/blockquote>\n<hr>\n"},{"id":"01-section-6","title":"2.1 证据链的形式化定义","level":3,"text":"定义 1（证据链） 。设数据库集合 $ mathcal{D} = { text{ChEMBL}, text{PubChem}, text{UniProtKB}, text{RCSB PDB} }$。证据链 $ mathcal{C}$ 是四元组的有序序列 $ mathcal{C} = langle L { mathrm{cmpd}}, L { mathrm{target}}, L { mathrm{seq}}, L { mathrm{act}} rangle,$ 其中每一层 $L i = ( mathrm{id} i, mathcal{D} i, mathrm{verify} i)$，$ mathrm{id} i$ 为该层的规范标识符，$ mathcal{D} i subseteq mathcal{D}$ 为承载该层的数据库，$ mathrm{verify} i : mathcal{D} i to { text{一致}, text{不一致}, text{待核验} }$ 为核验映射。命题 1 断言 $ mathrm{verify} i = text{一致}$ 对 $i in {1,2,3 }$ 成立（化合物、靶点、序列三层），第四层（活性）的核验结果为\"一致但带警告\"。","html":"<p><strong>定义 1（证据链）<\/strong>。设数据库集合 $\\mathcal{D} = {\\text{ChEMBL},\\ \\text{PubChem},\\ \\text{UniProtKB},\\ \\text{RCSB PDB}}$。证据链 $\\mathcal{C}$ 是四元组的有序序列<\/p>\n<p>$\\mathcal{C} = \\langle L_{\\mathrm{cmpd}},\\ L_{\\mathrm{target}},\\ L_{\\mathrm{seq}},\\ L_{\\mathrm{act}} \\rangle,$<\/p>\n<p>其中每一层 $L_i = (\\mathrm{id}_i, \\mathcal{D}_i, \\mathrm{verify}_i)$，$\\mathrm{id}_i$ 为该层的规范标识符，$\\mathcal{D}_i \\subseteq \\mathcal{D}$ 为承载该层的数据库，$\\mathrm{verify}_i : \\mathcal{D}_i \\to {\\text{一致}, \\text{不一致}, \\text{待核验}}$ 为核验映射。命题 1 断言 $\\mathrm{verify}_i = \\text{一致}$ 对 $i \\in {1,2,3}$ 成立（化合物、靶点、序列三层），第四层（活性）的核验结果为&quot;一致但带警告&quot;。<\/p>\n"},{"id":"01-section-7","title":"2.2 身份核验的判据","level":3,"text":"- 化合物层 ：以 PubChem CID 1986 为规范标识，要求 ChEMBL20 中对应条目的化学身份映射通过（本简报记录为\"通过\"，映射细节见附录 A 复现路径）。 - 靶点层 ：以 CHEMBL205 与 UniProtKB P00918 为双标识，要求二者指向同一蛋白实体（记录为\"通过\"）。 - 序列层 ：将 PDB 3HS4 entity 1 的氨基酸序列与 P00918 序列做逐字符比对。比对结果为 260 个字符完全一致 （逐字符一致，非比对得分意义上的\"高相似\"）。记一致性指标 $ mathrm{Identity} = frac{ {i : s i = t i }}{ min( s , t )} = frac{260}{260} = 1,$ 即 100% 逐字符一致。","html":"<ul>\n<li><strong>化合物层<\/strong>：以 PubChem CID 1986 为规范标识，要求 ChEMBL20 中对应条目的化学身份映射通过（本简报记录为&quot;通过&quot;，映射细节见附录 A 复现路径）。<\/li>\n<li><strong>靶点层<\/strong>：以 CHEMBL205 与 UniProtKB P00918 为双标识，要求二者指向同一蛋白实体（记录为&quot;通过&quot;）。<\/li>\n<li><strong>序列层<\/strong>：将 PDB 3HS4 entity 1 的氨基酸序列与 P00918 序列做逐字符比对。比对结果为<strong>260 个字符完全一致<\/strong>（逐字符一致，非比对得分意义上的&quot;高相似&quot;）。记一致性指标<\/li>\n<\/ul>\n<p>$\\mathrm{Identity} = \\frac{#{i : s_i = t_i}}{\\min(|s|,|t|)} = \\frac{260}{260} = 1,$<\/p>\n<p>即 100% 逐字符一致。<\/p>\n"},{"id":"01-section-8","title":"2.3 活性层模型与 pChEMBL 重算","level":3,"text":"对抑制常数 $K i$，ChEMBL 的 pChEMBL 约定为 $ mathrm{pChEMBL}=- log {10} ! left(K i mathrm{mol ,L^{-1}} right).$ 将 $K i = 12 mathrm{nM} = 1.2 times 10^{-8} mathrm{mol/L}$ 代入： $- log {10}(12 times10^{-9})=7.920818753952375 ldots$ 本地重算值记录为 7.920818753952375 。该值与数据库条目的一致性经复核确认（数值层面的重算通过；末位差异若出现应归因于浮点表示，本简报记录的重算值即为上式结果）。 说明（已知 vs 推测） ：Ki = 12 nM 与重算 pChEMBL 是 已核验数据 ；\"该值代表 AZM 对 CA II 的典型效力\"是 推测 ，本简报不采纳。","html":"<p>对抑制常数 $K_i$，ChEMBL 的 pChEMBL 约定为<\/p>\n<p>$\\mathrm{pChEMBL}=-\\log_{10}!\\left(K_i[\\mathrm{mol,L^{-1}}]\\right).$<\/p>\n<p>将 $K_i = 12\\ \\mathrm{nM} = 1.2\\times 10^{-8}\\ \\mathrm{mol/L}$ 代入：<\/p>\n<p>$-\\log_{10}(12\\times10^{-9})=7.920818753952375\\ldots$<\/p>\n<p>本地重算值记录为 <strong>7.920818753952375<\/strong>。该值与数据库条目的一致性经复核确认（数值层面的重算通过；末位差异若出现应归因于浮点表示，本简报记录的重算值即为上式结果）。<\/p>\n<blockquote>\n<p><strong>说明（已知 vs 推测）<\/strong>：Ki = 12 nM 与重算 pChEMBL 是<strong>已核验数据<\/strong>；&quot;该值代表 AZM 对 CA II 的典型效力&quot;是<strong>推测<\/strong>，本简报不采纳。<\/p>\n<\/blockquote>\n"},{"id":"01-section-9","title":"2.4 审计警告的逻辑地位","level":3,"text":"potential duplicate=1 在 ChEMBL 数据管道中表示该活性记录与其他记录 可能 存在重复；具体原因需由原始实验和数据库血缘进一步判断。其逻辑地位为： - 它不是矛盾证据：记录的内部数值（Ki、pChEMBL 重算）自洽； - 它也不是独立性证明：在合并统计或训练集去重时，该记录 不得 被视为独立观测； - 剔除或保留需外部判据；本简报采取保守策略—— 保留并标注 。 ---","html":"<p><code>potential_duplicate=1<\/code> 在 ChEMBL 数据管道中表示该活性记录与其他记录<strong>可能<\/strong>存在重复；具体原因需由原始实验和数据库血缘进一步判断。其逻辑地位为：<\/p>\n<ul>\n<li>它不是矛盾证据：记录的内部数值（Ki、pChEMBL 重算）自洽；<\/li>\n<li>它也不是独立性证明：在合并统计或训练集去重时，该记录<strong>不得<\/strong>被视为独立观测；<\/li>\n<li>剔除或保留需外部判据；本简报采取保守策略——<strong>保留并标注<\/strong>。<\/li>\n<\/ul>\n<hr>\n"},{"id":"01-section-10","title":"3.1 核验结果汇总","level":3,"text":"指标 数值 说明 --- --- --- CA II 序列一致长度 260 aa P00918 与 3HS4 entity 1 逐字符一致 单 assay Ki 12 nM 仅属于 CHEMBL657848 pChEMBL（重算） 7.920818753952375 见 §2.3 推导 3HS4 分辨率 1.1 Å X 射线实验复合物 3HS4 中 AZM entity 4 与蛋白（entity 1）共晶 审计警告 potential duplicate=1 保留，不剔除 图注：CA II 的 260 个残基逐字符一致。 图中每位置均为 1，表示 P00918 与 3HS4 entity 1 在全部 260 个位置一致。这是序列身份核验，不是酶功能验证。","html":"<table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>数值<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>CA II 序列一致长度<\/td>\n<td><strong>260 aa<\/strong><\/td>\n<td>P00918 与 3HS4 entity 1 逐字符一致<\/td>\n<\/tr>\n<tr>\n<td>单 assay Ki<\/td>\n<td><strong>12 nM<\/strong><\/td>\n<td>仅属于 CHEMBL657848<\/td>\n<\/tr>\n<tr>\n<td>pChEMBL（重算）<\/td>\n<td><strong>7.920818753952375<\/strong><\/td>\n<td>见 §2.3 推导<\/td>\n<\/tr>\n<tr>\n<td>3HS4 分辨率<\/td>\n<td><strong>1.1 Å<\/strong><\/td>\n<td>X 射线实验复合物<\/td>\n<\/tr>\n<tr>\n<td>3HS4 中 AZM<\/td>\n<td>entity 4<\/td>\n<td>与蛋白（entity 1）共晶<\/td>\n<\/tr>\n<tr>\n<td>审计警告<\/td>\n<td><code>potential_duplicate=1<\/code><\/td>\n<td>保留，不剔除<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><img class=\"paper-image\" src=\"../../assets/papers/01_乙酰唑胺跨库证据链/fig01a_sequence_identity.png\" alt=\"CA II 的 260 个残基逐字符一致\" loading=\"lazy\"><\/p>\n<p><em>图注：CA II 的 260 个残基逐字符一致。<\/em><\/p>\n<p>图中每位置均为 1，表示 P00918 与 3HS4 entity 1 在全部 260 个位置一致。这是序列身份核验，不是酶功能验证。<\/p>\n"},{"id":"01-section-11","title":"3.2 逐层核验状态","level":3,"text":"层 数据库条目 核验结论 --- --- --- $L { mathrm{cmpd}}$ PubChem 1986 / ChEMBL20 通过 $L { mathrm{target}}$ CHEMBL205 / P00918 通过 $L { mathrm{seq}}$ 3HS4 entity 1 vs P00918 通过（260/260 字符一致） $L { mathrm{act}}$ CHEMBL657848 通过，带警告 图注：选定 assay 的 Ki 与 pChEMBL 重算。 左图只表示 CHEMBL657848 的 12 nM；右图外部记录为 7.92，本地重算为 7.920818753952375。二者精度不同，不应被解释为实验误差。","html":"<table>\n<thead>\n<tr>\n<th>层<\/th>\n<th>数据库条目<\/th>\n<th>核验结论<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>$L_{\\mathrm{cmpd}}$<\/td>\n<td>PubChem 1986 / ChEMBL20<\/td>\n<td>通过<\/td>\n<\/tr>\n<tr>\n<td>$L_{\\mathrm{target}}$<\/td>\n<td>CHEMBL205 / P00918<\/td>\n<td>通过<\/td>\n<\/tr>\n<tr>\n<td>$L_{\\mathrm{seq}}$<\/td>\n<td>3HS4 entity 1 vs P00918<\/td>\n<td>通过（260/260 字符一致）<\/td>\n<\/tr>\n<tr>\n<td>$L_{\\mathrm{act}}$<\/td>\n<td>CHEMBL657848<\/td>\n<td>通过，带警告<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><img class=\"paper-image\" src=\"../../assets/papers/01_乙酰唑胺跨库证据链/fig01b_activity_pchembl.png\" alt=\"选定 assay 的 Ki 与 pChEMBL 重算\" loading=\"lazy\"><\/p>\n<p><em>图注：选定 assay 的 Ki 与 pChEMBL 重算。<\/em><\/p>\n<p>左图只表示 CHEMBL657848 的 12 nM；右图外部记录为 7.92，本地重算为 7.920818753952375。二者精度不同，不应被解释为实验误差。<\/p>\n"},{"id":"01-section-12","title":"3.3 结构性发现","level":3,"text":"3HS4 为 1.1 Å 分辨率的 X 射线实验复合物，同时含 CA II 蛋白（entity 1）与 AZM（entity 4）。该分辨率量级足以支持配体结合模式的直接几何观察，是 AZM–CA II 结合构象的 直接结构证据 （区别于模型预测或对接假设）。本简报不进一步解读配体结合几何细节，因其超出本次审计范围。 图注：药物—靶点—序列—实验结构的分层证据链。 四层节点分别回答“是谁、作用于谁、序列是否对应、是否存在实验复合物”。底部活性节点单独标明 assay 与重复警告，避免把不同证据类型压成一个成功标签。 图注：TPSA 与 LogP 的算法口径对照。 TPSA 在计入 S/P 后为 151.66 Å²，与 PubChem 整数显示 152 同口径；MolLogP 与 XLogP 则属于不同算法，数值差异不能直接判作数据造假。 ---","html":"<p>3HS4 为 1.1 Å 分辨率的 X 射线实验复合物，同时含 CA II 蛋白（entity 1）与 AZM（entity 4）。该分辨率量级足以支持配体结合模式的直接几何观察，是 AZM–CA II 结合构象的<strong>直接结构证据<\/strong>（区别于模型预测或对接假设）。本简报不进一步解读配体结合几何细节，因其超出本次审计范围。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/01_乙酰唑胺跨库证据链/fig01c_evidence_chain.png\" alt=\"药物—靶点—序列—实验结构的分层证据链\" loading=\"lazy\"><\/p>\n<p><em>图注：药物—靶点—序列—实验结构的分层证据链。<\/em><\/p>\n<p>四层节点分别回答“是谁、作用于谁、序列是否对应、是否存在实验复合物”。底部活性节点单独标明 assay 与重复警告，避免把不同证据类型压成一个成功标签。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/01_乙酰唑胺跨库证据链/fig01d_descriptor_audit.png\" alt=\"TPSA 与 LogP 的算法口径对照\" loading=\"lazy\"><\/p>\n<p><em>图注：TPSA 与 LogP 的算法口径对照。<\/em><\/p>\n<p>TPSA 在计入 S/P 后为 151.66 Å²，与 PubChem 整数显示 152 同口径；MolLogP 与 XLogP 则属于不同算法，数值差异不能直接判作数据造假。<\/p>\n<hr>\n"},{"id":"01-section-13","title":"4.1 命题 1 的成立条件","level":3,"text":"命题 1 在以下意义上成立：四层标识符之间的映射关系经过本地复核且一致，序列层达到逐字符 100% 一致。该结论的强度上限是\" 跨库身份可复核 \"——它不蕴含数据库之外任何实验事实。特别是，序列一致证明的是\"3HS4 entity 1 即 P00918 所登记的 CA II\"，而非\"CA II 的功能如何如何\"。","html":"<p>命题 1 在以下意义上成立：四层标识符之间的映射关系经过本地复核且一致，序列层达到逐字符 100% 一致。该结论的强度上限是&quot;<strong>跨库身份可复核<\/strong>&quot;——它不蕴含数据库之外任何实验事实。特别是，序列一致证明的是&quot;3HS4 entity 1 即 P00918 所登记的 CA II&quot;，而非&quot;CA II 的功能如何如何&quot;。<\/p>\n"},{"id":"01-section-14","title":"4.2 活性边界：为何 12 nM 不能被外推","level":3,"text":"从单一 assay 的 $K i = 12$ nM 到\"AZM 对 CA II 的效力\"之间存在三重跳跃，每一步在本简报中均不予跨越： 1. 单 assay → 该测定条件下的表观值 ：$K i$ 依赖测定条件（pH、温度、缓冲体系、测定方法），单一记录只覆盖单一条件； 2. 表观值 → 统一抑制效力 ：文献共识中 AZM–CA II 的 $K i$ 分布于纳摩尔量级的一个区间内，12 nM 是区间内一点，非区间代表； 3. 生化效力 → 临床结论 ：涉及药代动力学、组织分布、给药途径，完全在生化数据射程之外。 因此命题 2 的否定形式——\"不得由 CHEMBL657848 推出统一效力或临床结论\"——是本简报对下游使用者最主要的限制性贡献。","html":"<p>从单一 assay 的 $K_i = 12$ nM 到&quot;AZM 对 CA II 的效力&quot;之间存在三重跳跃，每一步在本简报中均不予跨越：<\/p>\n<ol>\n<li><strong>单 assay → 该测定条件下的表观值<\/strong>：$K_i$ 依赖测定条件（pH、温度、缓冲体系、测定方法），单一记录只覆盖单一条件；<\/li>\n<li><strong>表观值 → 统一抑制效力<\/strong>：文献共识中 AZM–CA II 的 $K_i$ 分布于纳摩尔量级的一个区间内，12 nM 是区间内一点，非区间代表；<\/li>\n<li><strong>生化效力 → 临床结论<\/strong>：涉及药代动力学、组织分布、给药途径，完全在生化数据射程之外。<\/li>\n<\/ol>\n<p>因此命题 2 的否定形式——&quot;不得由 CHEMBL657848 推出统一效力或临床结论&quot;——是本简报对下游使用者最主要的限制性贡献。<\/p>\n"},{"id":"01-section-15","title":"4.3 `potential_duplicate=1` 的处理策略及其理由","level":3,"text":"本简报选择保留该记录，理由有二：其一，警告的语义是\"可能重复\"而非\"已证伪\"，不能在缺乏依据时删除待审计记录；其二，若后续去重确证其非独立，则在使用层面（合并统计、训练集）施加去重约束即可，原始记录应保留以维持审计可追溯性。此策略与 FAIR 原则中的可追溯性（provenance）要求一致。","html":"<p>本简报选择保留该记录，理由有二：其一，警告的语义是&quot;可能重复&quot;而非&quot;已证伪&quot;，不能在缺乏依据时删除待审计记录；其二，若后续去重确证其非独立，则在使用层面（合并统计、训练集）施加去重约束即可，原始记录应保留以维持审计可追溯性。此策略与 FAIR 原则中的可追溯性（provenance）要求一致。<\/p>\n"},{"id":"01-section-16","title":"4.4 局限性","level":3,"text":"1. 活性层选取 一条 Ki 记录，样本量 $n=1$，任何分布性推断在统计上均不合法； 2. 本工作为数据库复核与本地计算， 不构成独立实验复现 ，不得以此表述对外； 3. 化合物层映射通过的复核细节依赖 ChEMBL 版本的管道状态，版本迁移后映射需重新核验（开放问题：见 §5.2）； 4. 序列一致性的判定基于字符比对，未涉及翻译后修饰、晶体构建（construct）差异等结构生物学层面的核验（待验证项）。","html":"<ol>\n<li>活性层选取<strong>一条<\/strong> Ki 记录，样本量 $n=1$，任何分布性推断在统计上均不合法；<\/li>\n<li>本工作为数据库复核与本地计算，<strong>不构成独立实验复现<\/strong>，不得以此表述对外；<\/li>\n<li>化合物层映射通过的复核细节依赖 ChEMBL 版本的管道状态，版本迁移后映射需重新核验（开放问题：见 §5.2）；<\/li>\n<li>序列一致性的判定基于字符比对，未涉及翻译后修饰、晶体构建（construct）差异等结构生物学层面的核验（待验证项）。<\/li>\n<\/ol>\n"},{"id":"01-section-17","title":"4.5 不同构建的结构对照与“独立重复”的边界","level":3,"text":"为检查结构证据能否跨实验成立，本文进一步比较 1997 年的 2H4N 与 2009 年的 3HS4。二者均为 X 射线衍射的人 CA II—乙酰唑胺实验结构，配体均为 AZM，分辨率分别为 1.9 Å 与 1.1 Å。它们提供的是不同时间、不同构建的结构对照，而不是同一野生型复合物的独立重复。 全局序列对齐显示三类差异：起始 M 缺失、H94N 替换和中段 P 插入。2H4N 返回序列字符串为 260 aa，而对应元数据 rcsb sample sequence length=259 ，这一长度不一致必须保留并回查原始 mmCIF。本文没有把 2H4N 简化为“仅一个点突变”，也没有比较两者的结合几何或 Ki，因此不将其写成活性重复。 候选排除同样重要：1CA2 虽为 CA II 但不含 AZM；3UCJ 来自绿藻；2XTK 来自真菌几丁质酶。只有先通过物种、蛋白身份、构建和配体检查，才能进入结构对照集合。 图注：2H4N 与 3HS4 的不同构建结构对照。 左图比较 3HS4 的 1.1 Å 与 2H4N 的 1.9 Å 分辨率；右图列出三类序列差异及 260/259 的长度元数据不一致。该对照丰富实验背景，但不满足同一野生型复合物的独立重复定义。 ---","html":"<p>为检查结构证据能否跨实验成立，本文进一步比较 1997 年的 2H4N 与 2009 年的 3HS4。二者均为 X 射线衍射的人 CA II—乙酰唑胺实验结构，配体均为 AZM，分辨率分别为 1.9 Å 与 1.1 Å。它们提供的是不同时间、不同构建的结构对照，而不是同一野生型复合物的独立重复。<\/p>\n<p>全局序列对齐显示三类差异：起始 M 缺失、H94N 替换和中段 P 插入。2H4N 返回序列字符串为 260 aa，而对应元数据 <code>rcsb_sample_sequence_length=259<\/code>，这一长度不一致必须保留并回查原始 mmCIF。本文没有把 2H4N 简化为“仅一个点突变”，也没有比较两者的结合几何或 Ki，因此不将其写成活性重复。<\/p>\n<p>候选排除同样重要：1CA2 虽为 CA II 但不含 AZM；3UCJ 来自绿藻；2XTK 来自真菌几丁质酶。只有先通过物种、蛋白身份、构建和配体检查，才能进入结构对照集合。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/01_乙酰唑胺跨库证据链/fig01e_structural_control.png\" alt=\"2H4N 与 3HS4 的不同构建结构对照\" loading=\"lazy\"><\/p>\n<p><em>图注：2H4N 与 3HS4 的不同构建结构对照。<\/em><\/p>\n<p>左图比较 3HS4 的 1.1 Å 与 2H4N 的 1.9 Å 分辨率；右图列出三类序列差异及 260/259 的长度元数据不一致。该对照丰富实验背景，但不满足同一野生型复合物的独立重复定义。<\/p>\n<hr>\n"},{"id":"01-section-18","title":"五、结论","level":2,"text":"1. 乙酰唑胺—CA II 关系在四库之间构成一条可逐层复核的证据链：PubChem 1986 / ChEMBL20（化合物）、CHEMBL205 / P00918（靶点）、3HS4 entity 1（260 aa 逐字符一致序列与 1.1 Å 结构，含 AZM entity 4）三层身份核验全部通过。 2. 选定的活性记录 CHEMBL657848（Ki = 12 nM，pChEMBL 重算 7.920818753952375）经数值复核自洽，但其效力结论的适用范围严格限于该单一 assay。 3. potential duplicate=1 被正确归类为审计警告；本简报采取\"保留并标注\"策略，建议下游使用者在合并分析时施加去重约束而非删除记录。 4. 本简报的方法（分层身份核验 + 活性边界划定 + 审计警告中性化处理）可迁移至任意药物—靶点对的跨库证据核型，尤其适合作为机器学习基准集构造前的合规性前置步骤。","html":"<ol>\n<li>乙酰唑胺—CA II 关系在四库之间构成一条可逐层复核的证据链：PubChem 1986 / ChEMBL20（化合物）、CHEMBL205 / P00918（靶点）、3HS4 entity 1（260 aa 逐字符一致序列与 1.1 Å 结构，含 AZM entity 4）三层身份核验全部通过。<\/li>\n<li>选定的活性记录 CHEMBL657848（Ki = 12 nM，pChEMBL 重算 7.920818753952375）经数值复核自洽，但其效力结论的适用范围严格限于该单一 assay。<\/li>\n<li><code>potential_duplicate=1<\/code> 被正确归类为审计警告；本简报采取&quot;保留并标注&quot;策略，建议下游使用者在合并分析时施加去重约束而非删除记录。<\/li>\n<li>本简报的方法（分层身份核验 + 活性边界划定 + 审计警告中性化处理）可迁移至任意药物—靶点对的跨库证据核型，尤其适合作为机器学习基准集构造前的合规性前置步骤。<\/li>\n<\/ol>\n"},{"id":"01-section-19","title":"5.2 开放问题","level":3,"text":"- ChEMBL 版本升级后，1986 / CHEMBL205 / CHEMBL657848 的映射稳定性（待验证）； - 若获得更多 AZM–CA II 活性记录，单 assay 边界是否转化为分布性结论（开放）； - 3HS4 的晶体构建细节与全长 P00918 的残基覆盖关系（待验证）。 ---","html":"<ul>\n<li>ChEMBL 版本升级后，1986 / CHEMBL205 / CHEMBL657848 的映射稳定性（待验证）；<\/li>\n<li>若获得更多 AZM–CA II 活性记录，单 assay 边界是否转化为分布性结论（开放）；<\/li>\n<li>3HS4 的晶体构建细节与全长 P00918 的残基覆盖关系（待验证）。<\/li>\n<\/ul>\n<hr>\n"},{"id":"01-section-20","title":"参考文献","level":2,"text":"1 EMBL-EBI. ChEMBL molecule CHEMBL20（ACETAZOLAMIDE）及 molecule structures。https://www.ebi.ac.uk/chembl/api/data 2 EMBL-EBI. ChEMBL target CHEMBL205（Carbonic anhydrase 2，Homo sapiens，component P00918）。同上。 3 EMBL-EBI. Activity 47560；assay CHEMBL657848；document CHEMBL1146805。Ki=12 nM，pChEMBL=7.92，potential duplicate=1。同上。 4 NCBI. PubChem CID 1986（Acetazolamide），MolecularFormula、ConnectivitySMILES、InChIKey、TPSA 与 XLogP。https://pubchem.ncbi.nlm.nih.gov/rest/pug 5 UniProt Consortium. UniProtKB reviewed P00918（CAH2 HUMAN），260 aa reviewed 序列。https://rest.uniprot.org 6 RCSB PDB. 3HS4：Human carbonic anhydrase II complexed with acetazolamide；entity 1 与 AZM entity 4。https://data.rcsb.org/rest/v1/core 7 Sippel KH, Robbins AH, Domsic J, Genis C, Agbandje-McKenna M, McKenna R. High-resolution structure of human carbonic anhydrase II complexed with acetazolamide reveals insights into inhibitor drug design. Acta Crystallographica Section F, 2009, 65:992–995. DOI: 10.1107/S1744309109036665（元数据由 PDB 3HS4 回读）。 8 RDKit contributors. RDKit 2026.9.1：规范结构、TPSA、Crippen MolLogP 与 ExactMolWt 的本地计算。https://github.com/rdkit/rdkit 9 本研究快照： validation/chembl-acetazolamide.json 、 validation/pdb-3hs4.json 、 validation/pdb-3hs4-ca2.json 、 validation/uniprot-ca2.json 、 validation/pubchem-acetazolamide.json 。 10 RCSB PDB. 2H4N：H94N carbonic anhydrase II complexed with acetazolamide；entity 1 与 AZM entity 3。https://data.rcsb.org/rest/v1/core 11 Lesburg CA, Huang C, Christianson DW, Fierke CA. Histidine -- carboxamide ligand substitutions in the zinc binding site of carbonic anhydrase II alter metal coordination geometry but retain catalytic activity. Biochemistry, 1997, 36:15780–15791. DOI: 10.1021/bi971296x（元数据由 PDB 2H4N 回读）。 12 本研究结构对照： validation/pdb-2h4n.json 与 validation/structural-control.json ，由 scripts/analyze structural control.py 全局对齐生成。","html":"<p>[1] EMBL-EBI. ChEMBL molecule CHEMBL20（ACETAZOLAMIDE）及 molecule_structures。<a href=\"https://www.ebi.ac.uk/chembl/api/data\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.ebi.ac.uk/chembl/api/data<\/a>\n[2] EMBL-EBI. ChEMBL target CHEMBL205（Carbonic anhydrase 2，Homo sapiens，component P00918）。同上。\n[3] EMBL-EBI. Activity 47560；assay CHEMBL657848；document CHEMBL1146805。Ki=12 nM，pChEMBL=7.92，potential_duplicate=1。同上。\n[4] NCBI. PubChem CID 1986（Acetazolamide），MolecularFormula、ConnectivitySMILES、InChIKey、TPSA 与 XLogP。<a href=\"https://pubchem.ncbi.nlm.nih.gov/rest/pug\" target=\"_blank\" rel=\"noreferrer noopener\">https://pubchem.ncbi.nlm.nih.gov/rest/pug<\/a>\n[5] UniProt Consortium. UniProtKB reviewed P00918（CAH2_HUMAN），260 aa reviewed 序列。<a href=\"https://rest.uniprot.org\" target=\"_blank\" rel=\"noreferrer noopener\">https://rest.uniprot.org<\/a>\n[6] RCSB PDB. 3HS4：Human carbonic anhydrase II complexed with acetazolamide；entity 1 与 AZM entity 4。<a href=\"https://data.rcsb.org/rest/v1/core\" target=\"_blank\" rel=\"noreferrer noopener\">https://data.rcsb.org/rest/v1/core<\/a>\n[7] Sippel KH, Robbins AH, Domsic J, Genis C, Agbandje-McKenna M, McKenna R. High-resolution structure of human carbonic anhydrase II complexed with acetazolamide reveals insights into inhibitor drug design. Acta Crystallographica Section F, 2009, 65:992–995. DOI: 10.1107/S1744309109036665（元数据由 PDB 3HS4 回读）。\n[8] RDKit contributors. RDKit 2026.9.1：规范结构、TPSA、Crippen MolLogP 与 ExactMolWt 的本地计算。<a href=\"https://github.com/rdkit/rdkit\" target=\"_blank\" rel=\"noreferrer noopener\">https://github.com/rdkit/rdkit<\/a>\n[9] 本研究快照：<code>validation/chembl-acetazolamide.json<\/code>、<code>validation/pdb-3hs4.json<\/code>、<code>validation/pdb-3hs4-ca2.json<\/code>、<code>validation/uniprot-ca2.json<\/code>、<code>validation/pubchem-acetazolamide.json<\/code>。\n[10] RCSB PDB. 2H4N：H94N carbonic anhydrase II complexed with acetazolamide；entity 1 与 AZM entity 3。<a href=\"https://data.rcsb.org/rest/v1/core\" target=\"_blank\" rel=\"noreferrer noopener\">https://data.rcsb.org/rest/v1/core<\/a>\n[11] Lesburg CA, Huang C, Christianson DW, Fierke CA. Histidine --&gt; carboxamide ligand substitutions in the zinc binding site of carbonic anhydrase II alter metal coordination geometry but retain catalytic activity. Biochemistry, 1997, 36:15780–15791. DOI: 10.1021/bi971296x（元数据由 PDB 2H4N 回读）。\n[12] 本研究结构对照：<code>validation/pdb-2h4n.json<\/code> 与 <code>validation/structural-control.json<\/code>，由 <code>scripts/analyze_structural_control.py<\/code> 全局对齐生成。<\/p>\n"},{"id":"01-section-21","title":"附录 A：复现路径","level":2,"text":"1. 依次运行 python scripts/verify rdkit.py （使用 D 盘 RDKit 环境）、 python scripts/verify ca2 sequence.py 和 python scripts/verify drug target structure.py 。 2. 检查 CHEMBL20 与 PubChem CID 1986 的 InChIKey 均为 BZKPWHYZMXOIDC-UHFFFAOYSA-N ，规范结构一致。 3. 检查 P00918 与 3HS4 entity 1 的 260 aa 逐字符一致，MD5 为 94EB709966E01FBC15DC1C46A0D03AC5 。 4. 检查 3HS4 的实验方法为 X-RAY DIFFRACTION、分辨率 1.1 Å、AZM 位于 entity 4。 5. 检查 Ki=12 nM 仅属于 CHEMBL657848；重算 −log10(12×10⁻⁹)=7.920818753952375 ，并保留 potential duplicate=1 。 6. 全部结论只覆盖数据库与本地计算，不包含湿实验或独立实验复现。 7. 运行 python scripts/analyze structural control.py ，复核 2H4N 的不同构建、三类序列差异及 260/259 长度元数据不一致；不得将其写为独立野生型重复。","html":"<ol>\n<li>依次运行 <code>python scripts/verify_rdkit.py<\/code>（使用 D 盘 RDKit 环境）、<code>python scripts/verify_ca2_sequence.py<\/code> 和 <code>python scripts/verify_drug_target_structure.py<\/code>。<\/li>\n<li>检查 CHEMBL20 与 PubChem CID 1986 的 InChIKey 均为 <code>BZKPWHYZMXOIDC-UHFFFAOYSA-N<\/code>，规范结构一致。<\/li>\n<li>检查 P00918 与 3HS4 entity 1 的 260 aa 逐字符一致，MD5 为 <code>94EB709966E01FBC15DC1C46A0D03AC5<\/code>。<\/li>\n<li>检查 3HS4 的实验方法为 X-RAY DIFFRACTION、分辨率 1.1 Å、AZM 位于 entity 4。<\/li>\n<li>检查 Ki=12 nM 仅属于 CHEMBL657848；重算 <code>−log10(12×10⁻⁹)=7.920818753952375<\/code>，并保留 <code>potential_duplicate=1<\/code>。<\/li>\n<li>全部结论只覆盖数据库与本地计算，不包含湿实验或独立实验复现。<\/li>\n<li>运行 <code>python scripts/analyze_structural_control.py<\/code>，复核 2H4N 的不同构建、三类序列差异及 260/259 长度元数据不一致；不得将其写为独立野生型重复。<\/li>\n<\/ol>\n"}]},{"id":"02","folder":"02_CA表观比值不稳定性","file":"02_CA表观比值不稳定性.md","title":"CA I/II 表观活性比为什么不应当作固定常数","status":"研究简报／预印本草案，未同行评议","characters":8389,"figures":[{"filename":"fig02a_document_ratios.png","src":"../../assets/papers/02_CA表观比值不稳定性/fig02a_document_ratios.png","alt":"fig02a document ratios"},{"filename":"fig02b_ki_pairs.png","src":"../../assets/papers/02_CA表观比值不稳定性/fig02b_ki_pairs.png","alt":"fig02b ki pairs"},{"filename":"fig02c_method_completeness.png","src":"../../assets/papers/02_CA表观比值不稳定性/fig02c_method_completeness.png","alt":"fig02c method completeness"},{"filename":"fig02d_assay_methods.png","src":"../../assets/papers/02_CA表观比值不稳定性/fig02d_assay_methods.png","alt":"fig02d assay methods"}],"figureFiles":["fig02a_document_ratios.png","fig02b_ki_pairs.png","fig02c_method_completeness.png","fig02d_assay_methods.png"],"pipelineId":"8ada04a1-2ee8-4603-a642-88902c439d96","sha256":"21237e6a225ef10a2155ffb9c9ef3fce2db4eff6ad4714f502905943e0150db5","sections":[{"id":"02-section-0","title":"CA I/II 表观活性比为什么不应当作固定常数","level":1,"text":"Why the Apparent CA I/CA II Inhibition Ratio Should Not Be Treated as a Fixed Constant --- 作者 千界花园学术系统 单位 千界花园学术系统 · 前沿共生计划 日期 2026年10月 分类 生物活性数据 · 方法学敏感性分析 · 研究简报／预印本草案（未同行评议） 文档血缘 千界花园流水线初稿，经数值、来源与边界核验修订 ---","html":"<h2><strong>Why the Apparent CA I/CA II Inhibition Ratio Should Not Be Treated as a Fixed Constant<\/strong><\/h2>\n<blockquote>\n<p><strong>作者<\/strong> | 千界花园学术系统\n<strong>单位<\/strong> | 千界花园学术系统 · 前沿共生计划\n<strong>日期<\/strong> | 2026年10月\n<strong>分类<\/strong> | 生物活性数据 · 方法学敏感性分析 · 研究简报／预印本草案（未同行评议）\n<strong>文档血缘<\/strong> | 千界花园流水线初稿，经数值、来源与边界核验修订<\/p>\n<\/blockquote>\n<hr>\n"},{"id":"02-section-1","title":"摘要","level":2,"text":"背景。 在碳酸酐酶抑制剂的比较性表述中，常把 CA I 与 CA II 的抑制常数之比概括为“固定选择性倍数”。本简报检验该做法在给定证据边界内是否可辩护。 已知。 共有六组 CA I/II 文档配对。其表观 (K i ) 比值范围从 20.833333333333332 到 75 ，极差倍数为 3.6 。仅一组配对（CHEMBL1146805）明确双方均采用酯酶方法；其余五组方法细节不足。除记录复核外，未执行跨文献合并估计。 负结果。 在方法学异质性不可排除、仅一组满足同方法可比较条件、且无置信区间的条件下，支持“单一固定 CA I/CA II 表观选择性常数”的证据不足。更合理的表述是：表观比值存在记录间跨度，且该跨度可能由真实同工酶差异、测定条件与记录不确定性共同造成；当前证据不能区分这些成分。 结论。 应避免将 CA I/CA II 表观 (K i ) 比写作固定常数；报告时应强制携带方法、方向定义、 assay 完整性、配对标识与不确定性说明，并在方法信息不足时禁止跨记录合并。 关键词 ：碳酸酐酶；表观 Ki；assay 可比性；跨文档敏感性；负结果 ---","html":"<p><strong>背景。<\/strong> 在碳酸酐酶抑制剂的比较性表述中，常把 CA I 与 CA II 的抑制常数之比概括为“固定选择性倍数”。本简报检验该做法在给定证据边界内是否可辩护。 <strong>已知。<\/strong> 共有六组 CA I/II 文档配对。其表观 (K_i) 比值范围从 <strong>20.833333333333332<\/strong> 到 <strong>75<\/strong>，极差倍数为 <strong>3.6<\/strong>。仅一组配对（CHEMBL1146805）明确双方均采用酯酶方法；其余五组方法细节不足。除记录复核外，未执行跨文献合并估计。 <strong>负结果。<\/strong> 在方法学异质性不可排除、仅一组满足同方法可比较条件、且无置信区间的条件下，支持“单一固定 CA I/CA II 表观选择性常数”的证据不足。更合理的表述是：表观比值存在记录间跨度，且该跨度可能由真实同工酶差异、测定条件与记录不确定性共同造成；当前证据不能区分这些成分。 <strong>结论。<\/strong> 应避免将 CA I/CA II 表观 (K_i) 比写作固定常数；报告时应强制携带方法、方向定义、 assay 完整性、配对标识与不确定性说明，并在方法信息不足时禁止跨记录合并。<\/p>\n<p><strong>关键词<\/strong>：碳酸酐酶；表观 Ki；assay 可比性；跨文档敏感性；负结果<\/p>\n<hr>\n"},{"id":"02-section-2","title":"1.1 问题陈述","level":3,"text":"碳酸酐酶 CA I 与 CA II 是高度同源但组织分布、催化速率与抑制谱不同的锌酶。药化与生化语境中经常需要比较某抑制剂对二者的选择性。常见做法是以表观抑制常数构造比值，例如 R {I/II}= frac{K {i, mathrm{app}}^{(I)}}{K {i, mathrm{app}}^{(II)}} , 其中 (K {i, mathrm{app}}^{(iso)} ) 表示在特定测定条件下对同工酶 (iso in {I,II } ) 估计得到的表观抑制常数。若 (R {I/II} 1 )，按上述定义表示对 CA I 的表观抑制弱于 CA II，即相对偏向 CA II；若实际数据库使用反向定义，则结论的数值范围不变，仅方向解释相反。本简报不预设数据库字段方向，而以“CA I/II 表观 (K i ) 比值”作为中性标签。 争议点不在于是否存在两个同工酶，而在于：把跨文档、跨条件或跨记录的 (R {I/II} ) 压扁为一个常数，是否属于可识别且可外推的统计—测量操作。","html":"<p>碳酸酐酶 CA I 与 CA II 是高度同源但组织分布、催化速率与抑制谱不同的锌酶。药化与生化语境中经常需要比较某抑制剂对二者的选择性。常见做法是以表观抑制常数构造比值，例如\n[\nR_{I/II}=\\frac{K_{i,\\mathrm{app}}^{(I)}}{K_{i,\\mathrm{app}}^{(II)}} ,\n]\n其中 (K_{i,\\mathrm{app}}^{(iso)}) 表示在特定测定条件下对同工酶 (iso\\in{I,II}) 估计得到的表观抑制常数。若 (R_{I/II}&gt;1)，按上述定义表示对 CA I 的表观抑制弱于 CA II，即相对偏向 CA II；若实际数据库使用反向定义，则结论的数值范围不变，仅方向解释相反。本简报不预设数据库字段方向，而以“CA I/II 表观 (K_i) 比值”作为中性标签。<\/p>\n<p>争议点不在于是否存在两个同工酶，而在于：把跨文档、跨条件或跨记录的 (R_{I/II}) 压扁为一个常数，是否属于可识别且可外推的统计—测量操作。<\/p>\n"},{"id":"02-section-3","title":"1.2 固定常数假设的含义","level":3,"text":"“固定选择性常数”至少包含三层可分别证伪的含义： 1. 同质性 ：不同记录中的真实同工酶选择性 (R^ ast ) 相同； 2. 可测性 ： assay 条件对分子与分母的乘性/加性影响在取比后相互抵消或近似稳定； 3. 可合并性 ：即便存在测量噪声，记录间差异也可由单一误差模型吸收，从而允许跨文献汇总估计。 若任一条件失败，固定常数就不是测量结果，而是对未观测异质性的强先验。","html":"<p>“固定选择性常数”至少包含三层可分别证伪的含义：<\/p>\n<ol>\n<li><strong>同质性<\/strong>：不同记录中的真实同工酶选择性 (R^\\ast) 相同；<\/li>\n<li><strong>可测性<\/strong>： assay 条件对分子与分母的乘性/加性影响在取比后相互抵消或近似稳定；<\/li>\n<li><strong>可合并性<\/strong>：即便存在测量噪声，记录间差异也可由单一误差模型吸收，从而允许跨文献汇总估计。<\/li>\n<\/ol>\n<p>若任一条件失败，固定常数就不是测量结果，而是对未观测异质性的强先验。<\/p>\n"},{"id":"02-section-4","title":"1.3 本简报范围与证据边界","level":3,"text":"本简报仅基于证据 CA-SELECTIVITY-SENSITIVITY-20261031。已知内容包括：六组文档配对；表观比值最小值 20.833333333333332，对应 CHEMBL1146805，且该配对明确双方均为酯酶方法；最大值 75，来自方法信息不完整文档；最大值/最小值 = 3.6。限制包括：五组 assay 方法信息不足；重复标记和相同数值限制独立解释；没有置信区间或临床外推。除记录级数值复核与算术差分外，本简报不产生、也不声称产生新的湿实验数据。","html":"<p>本简报仅基于证据 CA-SELECTIVITY-SENSITIVITY-20261031。已知内容包括：六组文档配对；表观比值最小值 20.833333333333332，对应 CHEMBL1146805，且该配对明确双方均为酯酶方法；最大值 75，来自方法信息不完整文档；最大值/最小值 = 3.6。限制包括：五组 assay 方法信息不足；重复标记和相同数值限制独立解释；没有置信区间或临床外推。除记录级数值复核与算术差分外，本简报不产生、也不声称产生新的湿实验数据。<\/p>\n"},{"id":"02-section-5","title":"1.4 本文的研究动机与内容安排","level":3,"text":"本数据的关键不是“比值有大有小”，而是 可比性结构失衡 ：在六组配对中，只有一组明确满足“同一测定范式下比较两个同工酶”的低混杂条件；其余五组的方法字段不足以确认底物、检测方式、底物浓度、酶源、 pH、温度、离子强度、反应时间、 tight-binding 处理与数据拟合模型是否一致。取比值并不能自动消除这些差异；相反，当分子与分母暴露于不同系统误差时，比值会把不可控误差压缩进一个看似简洁的选择性倍数。 因此，问题从“平均选择性是多少”转化为“是否存在一个可识别、可合并、可外推的选择性参数”。这正是负结果的核心：当前证据应被拒绝用于支撑固定常数，而非被弱化为“大概几十倍”的口头近似。 ---","html":"<p>本数据的关键不是“比值有大有小”，而是<strong>可比性结构失衡<\/strong>：在六组配对中，只有一组明确满足“同一测定范式下比较两个同工酶”的低混杂条件；其余五组的方法字段不足以确认底物、检测方式、底物浓度、酶源、 pH、温度、离子强度、反应时间、 tight-binding 处理与数据拟合模型是否一致。取比值并不能自动消除这些差异；相反，当分子与分母暴露于不同系统误差时，比值会把不可控误差压缩进一个看似简洁的选择性倍数。<\/p>\n<p>因此，问题从“平均选择性是多少”转化为“是否存在一个可识别、可合并、可外推的选择性参数”。这正是负结果的核心：当前证据应被拒绝用于支撑固定常数，而非被弱化为“大概几十倍”的口头近似。<\/p>\n<hr>\n"},{"id":"02-section-6","title":"2.1 表观抑制常数的分解","level":3,"text":"令记录 (m ) 中同工酶 (iso ) 的表观值为 K {i, mathrm{app},m}^{(iso)} = K i^{ ast(iso)} cdot g m(iso) cdot h m(iso) cdot eta m(iso), 其中 (K i^{ ast(iso)} ) 为目标条件下的本征抑制常数； (g m(iso) ) 表示记录级系统因素，例如酶批间活性分数、标记重复、计算口径； (h m(iso) ) 表示方法学因素，例如底物浓度、检测原理、 pH、温度、反应时间与拟合模型； ( eta m(iso) ) 表示随机测量误差。取自然对数后， ell {m}^{(iso)}= log K i^{ ast(iso)}+ gamma m(iso)+ chi m(iso)+ varepsilon m(iso). 表观比值为 log widehat R m = ell m^{(I)}- ell m^{(II)} = log R^ ast + Delta gamma m+ Delta chi m+ Delta varepsilon m, 其中 Delta gamma m= gamma m(I)- gamma m(II), quad Delta chi m= chi m(I)- chi m(II), quad Delta varepsilon m= varepsilon m(I)- varepsilon m(II). 固定常数假设要求，在可比较记录集合上， Delta gamma m+ Delta chi m approx 0 quad text{且} quad operatorname{Var}( Delta varepsilon m) text{可被单一模型吸收}. 若方法效应同向但不同源， ( Delta chi m ) 不一定为零；若记录重复或同一数值被多次标记， ( Delta gamma m ) 也不再独立。","html":"<h1>令记录 (m) 中同工酶 (iso) 的表观值为\n[\nK_{i,\\mathrm{app},m}^{(iso)}<\/h1>\n<p>K_i^{\\ast(iso)}\n\\cdot g_m(iso)\n\\cdot h_m(iso)\n\\cdot \\eta_m(iso),\n]\n其中 (K_i^{\\ast(iso)}) 为目标条件下的本征抑制常数；(g_m(iso)) 表示记录级系统因素，例如酶批间活性分数、标记重复、计算口径；(h_m(iso)) 表示方法学因素，例如底物浓度、检测原理、 pH、温度、反应时间与拟合模型；(\\eta_m(iso)) 表示随机测量误差。取自然对数后，\n[\n\\ell_{m}^{(iso)}=\\log K_i^{\\ast(iso)}+\\gamma_m(iso)+\\chi_m(iso)+\\varepsilon_m(iso).\n]<\/p>\n<h1>表观比值为\n[\n\\log \\widehat R_m<\/h1>\n<h1>\\ell_m^{(I)}-\\ell_m^{(II)}<\/h1>\n<p>\\log R^\\ast\n+\n\\Delta\\gamma_m+\\Delta\\chi_m+\\Delta\\varepsilon_m,\n]\n其中\n[\n\\Delta\\gamma_m=\\gamma_m(I)-\\gamma_m(II),\\quad\n\\Delta\\chi_m=\\chi_m(I)-\\chi_m(II),\\quad\n\\Delta\\varepsilon_m=\\varepsilon_m(I)-\\varepsilon_m(II).\n]<\/p>\n<p>固定常数假设要求，在可比较记录集合上，\n[\n\\Delta\\gamma_m+\\Delta\\chi_m \\approx 0\n\\quad\\text{且}\\quad\n\\operatorname{Var}(\\Delta\\varepsilon_m)\\ \\text{可被单一模型吸收}.\n]\n若方法效应同向但不同源，(\\Delta\\chi_m) 不一定为零；若记录重复或同一数值被多次标记，(\\Delta\\gamma_m) 也不再独立。<\/p>\n"},{"id":"02-section-7","title":"2.2 命题：在所述异质性条件下，固定比值的合并估计缺乏可识别性","level":3,"text":"命题陈述。 若在候选记录集合中，至少存在一部分配对满足 ( Delta chi m neq 0 ) 或 ( operatorname{Cov}( gamma m(I), gamma m(II)) ) 未受控，则不存在由该集合可一致估计的单一参数 ( theta )，使得对所有可比记录均有 ( mathbb E log widehat R m- theta =0 ) 且误差可分解为单一同质噪声。 证明梗概。 采用反证。设存在这样的 ( theta )。则对所有纳入记录， mathbb E log widehat R m- theta = ( log R^ ast- theta)+ Delta gamma m+ Delta chi m. 若 ( Delta chi m neq 0 ) 且无记录级协变量可将其归零，则左端为记录依赖量，不可能同时等于零而右端含记录依赖偏差；故无偏性失败。若记录间存在重复标记或相同数值，则 ( Delta gamma m ) 在样本中诱导伪重复，独立同分布或弱相关噪声假设失败，常用合并估计量的有效样本量被高估，抽样方差被低估。二者均使固定 ( theta ) 的识别失败。证毕。 该命题不证明真实选择性一定变化；它证明的是：在方法异质与伪重复不可排除时，固定常数不是可由这些记录一致恢复的对象。","html":"<p><strong>命题陈述。<\/strong> 若在候选记录集合中，至少存在一部分配对满足 (\\Delta\\chi_m\\neq 0) 或 (\\operatorname{Cov}(\\gamma_m(I),\\gamma_m(II))) 未受控，则不存在由该集合可一致估计的单一参数 (\\theta)，使得对所有可比记录均有 (\\mathbb E[\\log \\widehat R_m-\\theta]=0) 且误差可分解为单一同质噪声。<\/p>\n<h1><strong>证明梗概。<\/strong> 采用反证。设存在这样的 (\\theta)。则对所有纳入记录，\n[\n\\mathbb E[\\log \\widehat R_m-\\theta]<\/h1>\n<p>(\\log R^\\ast-\\theta)+\\Delta\\gamma_m+\\Delta\\chi_m.\n]\n若 (\\Delta\\chi_m\\neq 0) 且无记录级协变量可将其归零，则左端为记录依赖量，不可能同时等于零而右端含记录依赖偏差；故无偏性失败。若记录间存在重复标记或相同数值，则 (\\Delta\\gamma_m) 在样本中诱导伪重复，独立同分布或弱相关噪声假设失败，常用合并估计量的有效样本量被高估，抽样方差被低估。二者均使固定 (\\theta) 的识别失败。证毕。<\/p>\n<p>该命题不证明真实选择性一定变化；它证明的是：在方法异质与伪重复不可排除时，固定常数不是可由这些记录一致恢复的对象。<\/p>\n"},{"id":"02-section-8","title":"2.3 敏感性的算术解释","level":3,"text":"在仅使用给定极值的条件下， frac{75}{20.833333333333332}=3.600000 （在所示精度下）。这意味着，若把其中一端当作“基准选择性”，另一端代表同一数量级的 3.6 倍偏离 。在未给出置信区间、误差棒或配对协方差时，3.6 不应被解释为不确定度倍数，也不应被解释为生物学真实选择性的置信范围；它只应被解释为 记录间表观比值的观察跨度 。","html":"<p>在仅使用给定极值的条件下，\n[\n\\frac{75}{20.833333333333332}=3.600000\n]\n（在所示精度下）。这意味着，若把其中一端当作“基准选择性”，另一端代表同一数量级的 <strong>3.6 倍偏离<\/strong>。在未给出置信区间、误差棒或配对协方差时，3.6 不应被解释为不确定度倍数，也不应被解释为生物学真实选择性的置信范围；它只应被解释为<strong>记录间表观比值的观察跨度<\/strong>。<\/p>\n"},{"id":"02-section-9","title":"2.4 方向性、同方法与临床外推的限制","level":3,"text":"- 方向性 ：若 (R {I/II}=K i^{(I)}/K i^{(II)} )，数值越大表示对 CA I 的表观抑制越弱；若源库字段反向，解释反向而倍数不变。写作时必须先定义方向。 - 同方法 ：CHEMBL1146805 是已知唯一明确双方均为酯酶方法的配对；它可提供低混杂参照，但不能代表其余五组。 - 临床外推 ：CA II 抑制与某些适应症相关、CA I 抑制常被视为脱靶或耐受性问题，这一般性背景不等于本数据支持任何治疗窗口；本简报不做临床结论。 ---","html":"<ul>\n<li><strong>方向性<\/strong>：若 (R_{I/II}=K_i^{(I)}/K_i^{(II)})，数值越大表示对 CA I 的表观抑制越弱；若源库字段反向，解释反向而倍数不变。写作时必须先定义方向。<\/li>\n<li><strong>同方法<\/strong>：CHEMBL1146805 是已知唯一明确双方均为酯酶方法的配对；它可提供低混杂参照，但不能代表其余五组。<\/li>\n<li><strong>临床外推<\/strong>：CA II 抑制与某些适应症相关、CA I 抑制常被视为脱靶或耐受性问题，这一般性背景不等于本数据支持任何治疗窗口；本简报不做临床结论。<\/li>\n<\/ul>\n<hr>\n"},{"id":"02-section-10","title":"3.1 给定证据汇总","level":3,"text":"指标 数值 解释边界 --- ---: --- 文档配对数 6 “文档配对”不自动等于独立实验 最小表观比值 20.833333333333332 CHEMBL1146805；明确双方均为酯酶方法 最大表观比值 75 方法信息不完整文档 最大值/最小值 3.6 仅由两端点得到的观察跨度，不是置信区间 上述表中数值均来自证据摘要或其直接商；未引入其他测定值、标准差或样本量。 图注：六组文档的 CA I/II 表观 Ki 比。 六组比值依次为 20.8333、75、75、28.5714、20.8333、75。只有 D1 明确同酯酶方法，因此不能把这六个数当成同一总体的独立随机样本。 图注：六组文档内 CA I 与 CA II 的 Ki 配对。 对数坐标显示 CA I 与 CA II 的绝对 Ki 水平及配对间距。D4 的比值为 200/7=28.5714，而其他多组为 250/12 或 900/12，说明端点并非全部数据。","html":"<table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th align=\"right\">数值<\/th>\n<th>解释边界<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>文档配对数<\/td>\n<td align=\"right\">6<\/td>\n<td>“文档配对”不自动等于独立实验<\/td>\n<\/tr>\n<tr>\n<td>最小表观比值<\/td>\n<td align=\"right\">20.833333333333332<\/td>\n<td>CHEMBL1146805；明确双方均为酯酶方法<\/td>\n<\/tr>\n<tr>\n<td>最大表观比值<\/td>\n<td align=\"right\">75<\/td>\n<td>方法信息不完整文档<\/td>\n<\/tr>\n<tr>\n<td>最大值/最小值<\/td>\n<td align=\"right\">3.6<\/td>\n<td>仅由两端点得到的观察跨度，不是置信区间<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>上述表中数值均来自证据摘要或其直接商；未引入其他测定值、标准差或样本量。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/02_CA表观比值不稳定性/fig02a_document_ratios.png\" alt=\"六组文档的 CA I/II 表观 Ki 比\" loading=\"lazy\"><\/p>\n<p><em>图注：六组文档的 CA I/II 表观 Ki 比。<\/em><\/p>\n<p>六组比值依次为 20.8333、75、75、28.5714、20.8333、75。只有 D1 明确同酯酶方法，因此不能把这六个数当成同一总体的独立随机样本。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/02_CA表观比值不稳定性/fig02b_ki_pairs.png\" alt=\"六组文档内 CA I 与 CA II 的 Ki 配对\" loading=\"lazy\"><\/p>\n<p><em>图注：六组文档内 CA I 与 CA II 的 Ki 配对。<\/em><\/p>\n<p>对数坐标显示 CA I 与 CA II 的绝对 Ki 水平及配对间距。D4 的比值为 200/7=28.5714，而其他多组为 250/12 或 900/12，说明端点并非全部数据。<\/p>\n"},{"id":"02-section-11","title":"3.2 六组文档配对明细","level":3,"text":"编号 ChEMBL 文档 CA I / CA II Ki（nM） 表观比值 方法状态 双方重复标记 --- --- ---: ---: --- --- D1 CHEMBL1146805 250 / 12 20.8333 明确同酯酶 1 / 1 D2 CHEMBL1133556 900 / 12 75.0000 信息不足 1 / 1 D3 CHEMBL1146697 900 / 12 75.0000 信息不足 1 / 1 D4 CHEMBL1136178 200 / 7 28.5714 信息不足 0 / 0 D5 CHEMBL1146695 250 / 12 20.8333 信息不足 1 / 1 D6 CHEMBL1134204 900 / 12 75.0000 信息不足 1 / 1 D1–D6 的“不同文档”不自动等于独立实验；相同数值与重复标记限制了独立性解释。","html":"<table>\n<thead>\n<tr>\n<th>编号<\/th>\n<th>ChEMBL 文档<\/th>\n<th align=\"right\">CA I / CA II Ki（nM）<\/th>\n<th align=\"right\">表观比值<\/th>\n<th>方法状态<\/th>\n<th>双方重复标记<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>D1<\/td>\n<td>CHEMBL1146805<\/td>\n<td align=\"right\">250 / 12<\/td>\n<td align=\"right\">20.8333<\/td>\n<td>明确同酯酶<\/td>\n<td>1 / 1<\/td>\n<\/tr>\n<tr>\n<td>D2<\/td>\n<td>CHEMBL1133556<\/td>\n<td align=\"right\">900 / 12<\/td>\n<td align=\"right\">75.0000<\/td>\n<td>信息不足<\/td>\n<td>1 / 1<\/td>\n<\/tr>\n<tr>\n<td>D3<\/td>\n<td>CHEMBL1146697<\/td>\n<td align=\"right\">900 / 12<\/td>\n<td align=\"right\">75.0000<\/td>\n<td>信息不足<\/td>\n<td>1 / 1<\/td>\n<\/tr>\n<tr>\n<td>D4<\/td>\n<td>CHEMBL1136178<\/td>\n<td align=\"right\">200 / 7<\/td>\n<td align=\"right\">28.5714<\/td>\n<td>信息不足<\/td>\n<td>0 / 0<\/td>\n<\/tr>\n<tr>\n<td>D5<\/td>\n<td>CHEMBL1146695<\/td>\n<td align=\"right\">250 / 12<\/td>\n<td align=\"right\">20.8333<\/td>\n<td>信息不足<\/td>\n<td>1 / 1<\/td>\n<\/tr>\n<tr>\n<td>D6<\/td>\n<td>CHEMBL1134204<\/td>\n<td align=\"right\">900 / 12<\/td>\n<td align=\"right\">75.0000<\/td>\n<td>信息不足<\/td>\n<td>1 / 1<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>D1–D6 的“不同文档”不自动等于独立实验；相同数值与重复标记限制了独立性解释。<\/p>\n"},{"id":"02-section-12","title":"3.3 不执行跨文献合并的理由","level":3,"text":"按既定限制，五组 assay 方法信息不足；重复标记和相同数值限制独立解释；没有置信区间或临床外推。因此本简报不计算合并均值、不进行随机效应或固定效应 meta 分析、不给异质性统计量，也不把数据库复核表述为独立实验复现。任何此类合并都会把未知方法效应伪装成精密度。","html":"<p>按既定限制，五组 assay 方法信息不足；重复标记和相同数值限制独立解释；没有置信区间或临床外推。因此本简报不计算合并均值、不进行随机效应或固定效应 meta 分析、不给异质性统计量，也不把数据库复核表述为独立实验复现。任何此类合并都会把未知方法效应伪装成精密度。<\/p>\n"},{"id":"02-section-13","title":"3.4 负结果的呈现","level":3,"text":"在允许报告的意义上，稳健陈述为： 六组文档配对的 CA I/II 表观 (K i ) 比值观察范围为 20.8333–75；仅 CHEMBL1146805 明确双方同用酯酶方法；其余五组方法信息不足。该结构不足以支持固定选择性常数。 不应陈述为： - “CA I/II 选择性恒为几十倍”； - “3.6 倍等于真实生物学变异”； - “数据库复核等同于实验重复”。 图注：同方法信息完整性：仅 1/6 明确匹配。 绿色部分是允许计算同方法表观比值的 D1；灰色五组不进入同方法合并。这个 1/5 划分是限制，不是额外实验样本量。 图注：CA I、CA II、CA IX 的 assay 方法对照。 CA I 与 CA II 可计算同酯酶方法的表观比值 20.8333；CA IX 使用 CO2 水合酶方法，只列出 Ki=25 nM 和 pChEMBL=7.60，不计算跨方法选择性比。 ---","html":"<p>在允许报告的意义上，稳健陈述为：\n<strong>六组文档配对的 CA I/II 表观 (K_i) 比值观察范围为 20.8333–75；仅 CHEMBL1146805 明确双方同用酯酶方法；其余五组方法信息不足。该结构不足以支持固定选择性常数。<\/strong><\/p>\n<p>不应陈述为：<\/p>\n<ul>\n<li>“CA I/II 选择性恒为几十倍”；<\/li>\n<li>“3.6 倍等于真实生物学变异”；<\/li>\n<li>“数据库复核等同于实验重复”。<\/li>\n<\/ul>\n<p><img class=\"paper-image\" src=\"../../assets/papers/02_CA表观比值不稳定性/fig02c_method_completeness.png\" alt=\"同方法信息完整性：仅 1/6 明确匹配\" loading=\"lazy\"><\/p>\n<p><em>图注：同方法信息完整性：仅 1/6 明确匹配。<\/em><\/p>\n<p>绿色部分是允许计算同方法表观比值的 D1；灰色五组不进入同方法合并。这个 1/5 划分是限制，不是额外实验样本量。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/02_CA表观比值不稳定性/fig02d_assay_methods.png\" alt=\"CA I、CA II、CA IX 的 assay 方法对照\" loading=\"lazy\"><\/p>\n<p><em>图注：CA I、CA II、CA IX 的 assay 方法对照。<\/em><\/p>\n<p>CA I 与 CA II 可计算同酯酶方法的表观比值 20.8333；CA IX 使用 CO2 水合酶方法，只列出 Ki=25 nM 和 pChEMBL=7.60，不计算跨方法选择性比。<\/p>\n<hr>\n"},{"id":"02-section-14","title":"4.1 观察跨度来自哪里：已知与推测","level":3,"text":"已知。 端点差为 3.6；同方法可比配对只有一组；其余方法信息不足。 推测但合理。 3.6 倍跨度可能混合三类来源：真实 CA I/CA II 亲和差异在不同化合物或不同测定条件下变化；表观 (K i ) 受 Cheng–Prusoff 型底物校正、 tight-binding 、酶活性分数与拟合域影响；记录层重复与同源数值降低有效独立性。上述机制仅为解释框架，未被当前数据定量区分。","html":"<p><strong>已知。<\/strong> 端点差为 3.6；同方法可比配对只有一组；其余方法信息不足。\n<strong>推测但合理。<\/strong> 3.6 倍跨度可能混合三类来源：真实 CA I/CA II 亲和差异在不同化合物或不同测定条件下变化；表观 (K_i) 受 Cheng–Prusoff 型底物校正、 tight-binding 、酶活性分数与拟合域影响；记录层重复与同源数值降低有效独立性。上述机制仅为解释框架，未被当前数据定量区分。<\/p>\n"},{"id":"02-section-15","title":"4.2 固定常数在写作中的风险","level":3,"text":"把 20.8333–75 压成常数会产生三重误导：其一，将方法噪声误认为同工酶本质；其二，把非独立文档当作独立证据，虚增信心；其三，使后续建模在灵敏度分析中继承一个未经识别的参数。对 CA I/CA II 这类仅相差一个数量级附近的表观比值，尤其应避免“约等于一个常数”的修辞。","html":"<p>把 20.8333–75 压成常数会产生三重误导：其一，将方法噪声误认为同工酶本质；其二，把非独立文档当作独立证据，虚增信心；其三，使后续建模在灵敏度分析中继承一个未经识别的参数。对 CA I/CA II 这类仅相差一个数量级附近的表观比值，尤其应避免“约等于一个常数”的修辞。<\/p>\n"},{"id":"02-section-16","title":"4.3 最低可接受报告规范","level":3,"text":"建议未来记录至少显式报告：方向定义； assay 类型；底物与底物浓度；检测原理； pH/温度/缓冲液；酶来源与活性标定；是否 tight-binding；拟合模型；是否重复测定；数据库 accession；以及是否允许跨记录合并。缺项时，应使用“表观”“记录间”“不可合并”等限定词，而不是选择性倍数。","html":"<p>建议未来记录至少显式报告：方向定义； assay 类型；底物与底物浓度；检测原理； pH/温度/缓冲液；酶来源与活性标定；是否 tight-binding；拟合模型；是否重复测定；数据库 accession；以及是否允许跨记录合并。缺项时，应使用“表观”“记录间”“不可合并”等限定词，而不是选择性倍数。<\/p>\n"},{"id":"02-section-17","title":"4.4 对后续工作的开放问题","level":3,"text":"- 待验证：在补齐方法字段后，端点差是否缩小；缩小程度多少；是否仍存在不可约真实异质性。 - 开放问题：如何为数据库记录构建可审计的同方法可比性分数，使“可合并”成为可检验属性而非编辑判断。 - 待验证：同一化合物在同源同工酶上的本征选择性是否在生理相关条件下稳定；本简报不提供该问题的实验答案。 ---","html":"<ul>\n<li>待验证：在补齐方法字段后，端点差是否缩小；缩小程度多少；是否仍存在不可约真实异质性。<\/li>\n<li>开放问题：如何为数据库记录构建可审计的同方法可比性分数，使“可合并”成为可检验属性而非编辑判断。<\/li>\n<li>待验证：同一化合物在同源同工酶上的本征选择性是否在生理相关条件下稳定；本简报不提供该问题的实验答案。<\/li>\n<\/ul>\n<hr>\n"},{"id":"02-section-18","title":"五、结论","level":2,"text":"给定六组 CA I/II 文档配对，表观 (K i ) 比值范围为 20.833333333333332 至 75 ，端点跨度 3.6 倍 ；仅一组（CHEMBL1146805）明确双方均为酯酶方法，其余五组方法细节不足。在这些限制下，证据不支持把 CA I/CA II 表观选择性视为固定常数，也不支持跨文献合并估计。严谨表述应为：存在记录间表观比值跨度；其来源不可在当前证据中唯一归因；任何后续定量使用必须附带方法完整性、方向定义与不确定性说明。 ---","html":"<p>给定六组 CA I/II 文档配对，表观 (K_i) 比值范围为 <strong>20.833333333333332 至 75<\/strong>，端点跨度 <strong>3.6 倍<\/strong>；仅一组（CHEMBL1146805）明确双方均为酯酶方法，其余五组方法细节不足。在这些限制下，证据不支持把 CA I/CA II 表观选择性视为固定常数，也不支持跨文献合并估计。严谨表述应为：存在记录间表观比值跨度；其来源不可在当前证据中唯一归因；任何后续定量使用必须附带方法完整性、方向定义与不确定性说明。<\/p>\n<hr>\n"},{"id":"02-section-19","title":"参考文献","level":2,"text":"1 EMBL-EBI. ChEMBL activities 47559/47560/47561，document CHEMBL1146805，record id=235477；CA I/II 为 esterase，CA IX 为 CO2 hydrase。https://www.ebi.ac.uk/chembl/api/data 2 EMBL-EBI. Activities 49652/49653，document CHEMBL1133556，record id=282506。Ki 900/12 nM，方法描述未给出酯酶细节。同上。 3 EMBL-EBI. Activities 80687/80688，document CHEMBL1146697，record id=136210。Ki 900/12 nM，方法信息不足。同上。 4 EMBL-EBI. Activities 106505/106506，document CHEMBL1136178，record id=180522。Ki 200/7 nM，双方 potential duplicate=0。同上。 5 EMBL-EBI. Activities 151872/151873，document CHEMBL1146695，record id=126435。Ki 250/12 nM，方法信息不足。同上。 6 EMBL-EBI. Activities 288595/288596，document CHEMBL1134204，record id=302270。Ki 900/12 nM，方法信息不足。同上。 7 EMBL-EBI. Assay CHEMBL873200、CHEMBL657848、CHEMBL657970：用于核对 esterase 与 CO2 hydrase 方法及 confidence score=8。同上。 8 本研究原始面板与计算： validation/chembl-ca-selectivity-panel.json 、 validation/ca-selectivity.json 、 validation/chembl-ca-document-pairs.json 、 validation/ca-document-stability.json 。","html":"<p>[1] EMBL-EBI. ChEMBL activities 47559/47560/47561，document CHEMBL1146805，record_id=235477；CA I/II 为 esterase，CA IX 为 CO2 hydrase。<a href=\"https://www.ebi.ac.uk/chembl/api/data\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.ebi.ac.uk/chembl/api/data<\/a>\n[2] EMBL-EBI. Activities 49652/49653，document CHEMBL1133556，record_id=282506。Ki 900/12 nM，方法描述未给出酯酶细节。同上。\n[3] EMBL-EBI. Activities 80687/80688，document CHEMBL1146697，record_id=136210。Ki 900/12 nM，方法信息不足。同上。\n[4] EMBL-EBI. Activities 106505/106506，document CHEMBL1136178，record_id=180522。Ki 200/7 nM，双方 potential_duplicate=0。同上。\n[5] EMBL-EBI. Activities 151872/151873，document CHEMBL1146695，record_id=126435。Ki 250/12 nM，方法信息不足。同上。\n[6] EMBL-EBI. Activities 288595/288596，document CHEMBL1134204，record_id=302270。Ki 900/12 nM，方法信息不足。同上。\n[7] EMBL-EBI. Assay CHEMBL873200、CHEMBL657848、CHEMBL657970：用于核对 esterase 与 CO2 hydrase 方法及 confidence_score=8。同上。\n[8] 本研究原始面板与计算：<code>validation/chembl-ca-selectivity-panel.json<\/code>、<code>validation/ca-selectivity.json<\/code>、<code>validation/chembl-ca-document-pairs.json<\/code>、<code>validation/ca-document-stability.json<\/code>。<\/p>\n"},{"id":"02-section-20","title":"附录 A：复现路径","level":2,"text":"1. 运行 python scripts/analyze ca selectivity.py ，检查 CA I/II 的 250/12=20.833333333333332，ΔpChEMBL=1.3187587626244124。 2. 确认 CA IX 的 25 nM 属于 CO2 hydrase assay，脚本强制 ca ix ratio computed=false 。 3. 运行 python scripts/analyze ca document stability.py ，枚举六组文档，得到最小 20.8333、最大 75、极差倍数 3.6。 4. 检查 strict method matched count=1 、 method incomplete count=5 、 meta analysis performed=false 。 5. 探索性中位数仅保留在机器结果中并明确“不是选择性估计”；正文不以其替代固定常数。","html":"<ol>\n<li>运行 <code>python scripts/analyze_ca_selectivity.py<\/code>，检查 CA I/II 的 250/12=20.833333333333332，ΔpChEMBL=1.3187587626244124。<\/li>\n<li>确认 CA IX 的 25 nM 属于 CO2 hydrase assay，脚本强制 <code>ca_ix_ratio_computed=false<\/code>。<\/li>\n<li>运行 <code>python scripts/analyze_ca_document_stability.py<\/code>，枚举六组文档，得到最小 20.8333、最大 75、极差倍数 3.6。<\/li>\n<li>检查 <code>strict_method_matched_count=1<\/code>、<code>method_incomplete_count=5<\/code>、<code>meta_analysis_performed=false<\/code>。<\/li>\n<li>探索性中位数仅保留在机器结果中并明确“不是选择性估计”；正文不以其替代固定常数。<\/li>\n<\/ol>\n"}]},{"id":"03","folder":"03_轻量可复现科研引擎","file":"03_轻量可复现科研引擎.md","title":"轻量可复现科研引擎的协作方法","status":"研究简报／预印本草案，未同行评议","characters":11196,"figures":[{"filename":"fig03a_sindy_coefficients.png","src":"../../assets/papers/03_轻量可复现科研引擎/fig03a_sindy_coefficients.png","alt":"fig03a sindy coefficients"},{"filename":"fig03b_material_recompute.png","src":"../../assets/papers/03_轻量可复现科研引擎/fig03b_material_recompute.png","alt":"fig03b material recompute"},{"filename":"fig03c_sequence_bridges.png","src":"../../assets/papers/03_轻量可复现科研引擎/fig03c_sequence_bridges.png","alt":"fig03c sequence bridges"},{"filename":"fig03d_evidence_boundaries.png","src":"../../assets/papers/03_轻量可复现科研引擎/fig03d_evidence_boundaries.png","alt":"fig03d evidence boundaries"}],"figureFiles":["fig03a_sindy_coefficients.png","fig03b_material_recompute.png","fig03c_sequence_bridges.png","fig03d_evidence_boundaries.png"],"pipelineId":"c306e81f-bce6-4d5b-b482-7a26c94da774","sha256":"d1776ee939e620e2de0049baf77e36d8ed18ad97d149ad233916761f75f2b9e4","sections":[{"id":"03-section-0","title":"轻量可复现科研引擎的协作方法","level":1,"text":"A Collaboration Method for Lightweight Reproducible Scientific Engines --- 作者 千界花园学术系统 单位 千界花园学术系统 · 前沿共生计划 日期 2026年10月 分类 AI for Science · 可复现基础设施 · 研究简报／预印本草案（未同行评议） 文档血缘 千界花园流水线初稿，经数值、来源与边界核验修订 ---","html":"<h2><strong>A Collaboration Method for Lightweight Reproducible Scientific Engines<\/strong><\/h2>\n<blockquote>\n<p><strong>作者<\/strong> | 千界花园学术系统\n<strong>单位<\/strong> | 千界花园学术系统 · 前沿共生计划\n<strong>日期<\/strong> | 2026年10月\n<strong>分类<\/strong> | AI for Science · 可复现基础设施 · 研究简报／预印本草案（未同行评议）\n<strong>文档血缘<\/strong> | 千界花园流水线初稿，经数值、来源与边界核验修订<\/p>\n<\/blockquote>\n<hr>\n"},{"id":"03-section-1","title":"摘要","level":2,"text":"动机 。上游科学计算栈（符号回归／SMT／化学信息学／材料结构工具）的版本演进与算法口径调整，会在下游工作流中引入“接口漂移”：结果仍然能运行，但其含义已经改变。现有可复现性讨论多聚焦于“能否重跑”，较少区分重跑行为在认识论上的类别。 方法 。本文提出一个轻量协作接口：将（i）已知答案集、(ii) 公开版本化快照、(iii) 限制清单（版本、样例集、算法口径）打包为 可重放包 （replay bundle, r‑bundle）。在该框架下，所有产出断言被显式分为三类： 验证 （对已知答案）、 复核 （对公开快照）、 发现 （超出前两者支持域）。本文仅作前两类断言，并对第三类保持克制。 结果（证据边界内） 。本地引擎清点为 4（PySINDy、Z3、RDKit、PyMatGen）；PySINDy 在已知线性系统上的最大系数误差为 0.00003136190275787598，属对已知答案的数值验证；硅密度重算值为 2.3128002565764314 g·cm⁻³，与固定 Materials Project 结构快照一致，属快照级复核。两者均为 接口证据 ，不构成独立实验复现，也不构成新材料预测。 结论 。可重放包的价值在于向上游提供可审计的验证与接口，而非向上游索取“新科学”的名义。该克制是方法特性而非缺陷。 关键词 ：可复现性；接口漂移；已知答案验证；公开快照复核；限制清单；r‑bundle ---","html":"<p><strong>动机<\/strong>。上游科学计算栈（符号回归／SMT／化学信息学／材料结构工具）的版本演进与算法口径调整，会在下游工作流中引入“接口漂移”：结果仍然能运行，但其含义已经改变。现有可复现性讨论多聚焦于“能否重跑”，较少区分重跑行为在认识论上的类别。 <strong>方法<\/strong>。本文提出一个轻量协作接口：将（i）已知答案集、(ii) 公开版本化快照、(iii) 限制清单（版本、样例集、算法口径）打包为<strong>可重放包<\/strong>（replay bundle, r‑bundle）。在该框架下，所有产出断言被显式分为三类：<strong>验证<\/strong>（对已知答案）、<strong>复核<\/strong>（对公开快照）、<strong>发现<\/strong>（超出前两者支持域）。本文仅作前两类断言，并对第三类保持克制。 <strong>结果（证据边界内）<\/strong>。本地引擎清点为 4（PySINDy、Z3、RDKit、PyMatGen）；PySINDy 在已知线性系统上的最大系数误差为 0.00003136190275787598，属对已知答案的数值验证；硅密度重算值为 2.3128002565764314 g·cm⁻³，与固定 Materials Project 结构快照一致，属快照级复核。两者均为<strong>接口证据<\/strong>，不构成独立实验复现，也不构成新材料预测。 <strong>结论<\/strong>。可重放包的价值在于向上游提供可审计的验证与接口，而非向上游索取“新科学”的名义。该克制是方法特性而非缺陷。<\/p>\n<p><strong>关键词<\/strong>：可复现性；接口漂移；已知答案验证；公开快照复核；限制清单；r‑bundle<\/p>\n<hr>\n"},{"id":"03-section-2","title":"1.1 问题背景","level":3,"text":"计算科学文献中，“reproducible / replicable / repeatable”长期混用。Barba (2018) 系统梳理了该术语的混乱史；Plesser (2018) 指出 reproducibility 与 replicability 的分歧本身已成为可复现研究的阻碍；美国国家科学院（National Academies, 2019）进一步将其制度化为“计算与实验结论的可信传递”问题。工程上，Roache (1998) 与 Oberkampf & Trucano (2002) 的 verification/validation 二分强调： 验证 回答“方程是否被正确求解”， 确认 回答“是否求解了正确的方程”。本文采用一个更细的工程化视角：对上游工具链而言，下游能给出的最有价值承诺通常不是“我复现了你的科学”，而是“ 在你的固定工件下，我的调用接口语义未漂移 ”。","html":"<p>计算科学文献中，“reproducible / replicable / repeatable”长期混用。Barba (2018) 系统梳理了该术语的混乱史；Plesser (2018) 指出 <em>reproducibility<\/em> 与 <em>replicability<\/em> 的分歧本身已成为可复现研究的阻碍；美国国家科学院（National Academies, 2019）进一步将其制度化为“计算与实验结论的可信传递”问题。工程上，Roache (1998) 与 Oberkampf &amp; Trucano (2002) 的 verification/validation 二分强调：<strong>验证<\/strong>回答“方程是否被正确求解”，<strong>确认<\/strong>回答“是否求解了正确的方程”。本文采用一个更细的工程化视角：对上游工具链而言，下游能给出的最有价值承诺通常不是“我复现了你的科学”，而是“<strong>在你的固定工件下，我的调用接口语义未漂移<\/strong>”。<\/p>\n"},{"id":"03-section-3","title":"1.2 术语界定（本简报内部约定）","level":3,"text":"- 已知答案（known answer） ：与上游实现无关、可由解析或基准独立给出的目标量。对其的偏差评估称 验证（verification） 。 - 公开快照（public snapshot） ：以不可变、版本化方式公开发布的输入工件（如结构文件、参数卡、数据库条目）。在同一快照与同一算法口径下重算得到一致数值，称 复核（recomputation against snapshot） ；它 不等于 对数据库物理正确性的独立确认。 - 新发现（discovery claim） ：其支持域超出已知答案与固定快照之并集的断言。本文 不作 此类断言。","html":"<ul>\n<li><strong>已知答案（known answer）<\/strong>：与上游实现无关、可由解析或基准独立给出的目标量。对其的偏差评估称 <strong>验证（verification）<\/strong>。<\/li>\n<li><strong>公开快照（public snapshot）<\/strong>：以不可变、版本化方式公开发布的输入工件（如结构文件、参数卡、数据库条目）。在同一快照与同一算法口径下重算得到一致数值，称 <strong>复核（recomputation against snapshot）<\/strong>；它<strong>不等于<\/strong>对数据库物理正确性的独立确认。<\/li>\n<li><strong>新发现（discovery claim）<\/strong>：其支持域超出已知答案与固定快照之并集的断言。本文<strong>不作<\/strong>此类断言。<\/li>\n<\/ul>\n"},{"id":"03-section-4","title":"1.3 相关工作","level":3,"text":"工具层：SINDy 类稀疏辨识源于 Brunton, Proctor & Kutz (2016)，其 Python 实现 PySINDy 见 Kaptanoglu et al. (2022, JOSS)；Z3 为 de Moura & Bjørner (2008, TACAS) 提出的高效 SMT 求解器；RDKit 为开源化学信息学库（rdkit.org）；材料结构操作由 PyMatGen（Ong et al., 2013, Computational Materials Science ）承担，Materials Project 的结构快照来源为 Jain et al. (2013, APL Materials )。治理层：FAIR 原则（Wilkinson et al., 2016, Scientific Data ）与 ACM artifact review/badging（ACM, 2020）提供了对象可发现性与评审徽章的语境。本文方法可视为面向 接口语义 的轻量 FAIR/artifact 子集：它不要求完整研究对象的可发布性，只要求“接口未漂移”的最小可审计性。","html":"<p>工具层：SINDy 类稀疏辨识源于 Brunton, Proctor &amp; Kutz (2016)，其 Python 实现 PySINDy 见 Kaptanoglu et al. (2022, JOSS)；Z3 为 de Moura &amp; Bjørner (2008, TACAS) 提出的高效 SMT 求解器；RDKit 为开源化学信息学库（rdkit.org）；材料结构操作由 PyMatGen（Ong et al., 2013, <em>Computational Materials Science<\/em>）承担，Materials Project 的结构快照来源为 Jain et al. (2013, <em>APL Materials<\/em>)。治理层：FAIR 原则（Wilkinson et al., 2016, <em>Scientific Data<\/em>）与 ACM artifact review/badging（ACM, 2020）提供了对象可发现性与评审徽章的语境。本文方法可视为面向<strong>接口语义<\/strong>的轻量 FAIR/artifact 子集：它不要求完整研究对象的可发布性，只要求“接口未漂移”的最小可审计性。<\/p>\n"},{"id":"03-section-5","title":"1.4 本文的研究动机与内容安排","level":3,"text":"本文的中心命题是 认识论区分命题 ： 将已知答案、公开快照与限制清单写成可重放包，可为上游提供验证与接口，但不冒充新科学发现。 由此给出三项贡献： 1. 三分类框架 ：把下游产出断言显式标注为 verification / recomputation / discovery，并规定其支持域（§2）。 2. r‑bundle 模式 ：给出 (K, S, L) 的最小结构，使“可重放”在工程上可操作（§2）。 3. 证据链最小数值集 ：在严格不越界的条件下给出可核对数值锚点（§3），并对限制与开放问题显式列账（§4、附录）。 需要强调：1.4 的命题是 规范性与条件性 的。它规定“何时只能称接口”，并不证明“何时确有新发现”；后者需要额外的不变量（见命题 2.4）。 ---","html":"<p>本文的中心命题是<strong>认识论区分命题<\/strong>：<em>将已知答案、公开快照与限制清单写成可重放包，可为上游提供验证与接口，但不冒充新科学发现。<\/em> 由此给出三项贡献：<\/p>\n<ol>\n<li><strong>三分类框架<\/strong>：把下游产出断言显式标注为 verification / recomputation / discovery，并规定其支持域（§2）。<\/li>\n<li><strong>r‑bundle 模式<\/strong>：给出 (K, S, L) 的最小结构，使“可重放”在工程上可操作（§2）。<\/li>\n<li><strong>证据链最小数值集<\/strong>：在严格不越界的条件下给出可核对数值锚点（§3），并对限制与开放问题显式列账（§4、附录）。<\/li>\n<\/ol>\n<p>需要强调：1.4 的命题是<strong>规范性与条件性<\/strong>的。它规定“何时只能称接口”，并不证明“何时确有新发现”；后者需要额外的不变量（见命题 2.4）。<\/p>\n<hr>\n"},{"id":"03-section-6","title":"定义 2.1（重放三元组 r‑bundle）","level":3,"text":"一个可重放包是三元组 (r=(K,S,L) )，其中： - (K )：已知答案集。每个元素为 ((q, a^{ } {q}) )， (a^{ } {q} ) 为量 (q ) 的独立基准值。 - (S )：公开快照集。每个元素为带版本指纹的不可变输入（结构、参数、条目）。 - (L )：限制清单，至少包含：库/求解器精确版本与构建指纹；样例集标识；算法口径（如数值微分方式、结构弛豫状态、密度定义与单位）；非确定性来源处置（随机种子、BLAS/线程、浮点求和顺序）。 记上游工件的固定实例为 ( mathcal U 0 )（由 (L ) 完全钉住）。执行算子 (E( cdot) ) 在 ( mathcal U 0 ) 上映射断言到布尔结论或数值。","html":"<p>一个可重放包是三元组 (r=(K,S,L))，其中：<\/p>\n<ul>\n<li>(K)：已知答案集。每个元素为 ((q, a^{<em>}_{q}))，(a^{<\/em>}_{q}) 为量 (q) 的独立基准值。<\/li>\n<li>(S)：公开快照集。每个元素为带版本指纹的不可变输入（结构、参数、条目）。<\/li>\n<li>(L)：限制清单，至少包含：库/求解器精确版本与构建指纹；样例集标识；算法口径（如数值微分方式、结构弛豫状态、密度定义与单位）；非确定性来源处置（随机种子、BLAS/线程、浮点求和顺序）。<\/li>\n<\/ul>\n<p>记上游工件的固定实例为 (\\mathcal U_0)（由 (L) 完全钉住）。执行算子 (E(\\cdot)) 在 (\\mathcal U_0) 上映射断言到布尔结论或数值。<\/p>\n"},{"id":"03-section-7","title":"定义 2.2（断言类别与支持域）","level":3,"text":"对断言 (a )，定义支持域 ( mathrm{supp}(a) subseteq K cup S cup { text{外部} } )。类别判定： - 若 ( mathrm{supp}(a) subseteq K )： (a ) 为 验证断言 。 - 若 ( mathrm{supp}(a) subseteq S )（且不含未固定的外部依赖）： (a ) 为 复核断言 。 - 若 ( mathrm{supp}(a) not subseteq K cup S )： (a ) 落入 发现候选 ，本简报不作此类结论。","html":"<p>对断言 (a)，定义支持域 (\\mathrm{supp}(a)\\subseteq K\\cup S\\cup{\\text{外部}})。类别判定：<\/p>\n<ul>\n<li>若 (\\mathrm{supp}(a)\\subseteq K)：(a) 为<strong>验证断言<\/strong>。<\/li>\n<li>若 (\\mathrm{supp}(a)\\subseteq S)（且不含未固定的外部依赖）：(a) 为<strong>复核断言<\/strong>。<\/li>\n<li>若 (\\mathrm{supp}(a)\\not\\subseteq K\\cup S)：(a) 落入<strong>发现候选<\/strong>，本简报不作此类结论。<\/li>\n<\/ul>\n"},{"id":"03-section-8","title":"命题 2.3（接口确定性与重放一致性）","level":3,"text":"若 (L ) 完全捕获非确定性来源，且 (a ) 的支持域被 ( mathcal U 0 ) 覆盖，则 (E( mathcal U 0) ) 对 (a ) 的判定在重放中保持不变；故 (a ) 可作为接口证据，而非发现证据。 证明要点 。由 (L ) 对版本的钉住与对随机种子/线程/求和顺序的处置， (E( mathcal U 0) ) 在给定浮点语义下为确定函数（在实现定义的浮点一致性范围内；这是工程假设而非数学恒等，已在 (L ) 中声明）。因 ( mathrm{supp}(a) subseteq K cup S ) 且 (K,S ) 为 ( mathcal U 0 ) 内固定快照，输入无外部变异源；确定函数在相同输入下输出相同，故重放结论一致。该一致性仅证明“在给定工件下接口语义稳定”，其语义内容不超过 (K cup S ) 所能表达的范围，因此不构成发现。∎","html":"<p><em>若 (L) 完全捕获非确定性来源，且 (a) 的支持域被 (\\mathcal U_0) 覆盖，则 (E(\\mathcal U_0)) 对 (a) 的判定在重放中保持不变；故 (a) 可作为接口证据，而非发现证据。<\/em><\/p>\n<p><strong>证明要点<\/strong>。由 (L) 对版本的钉住与对随机种子/线程/求和顺序的处置，(E(\\mathcal U_0)) 在给定浮点语义下为确定函数（在实现定义的浮点一致性范围内；这是工程假设而非数学恒等，已在 (L) 中声明）。因 (\\mathrm{supp}(a)\\subseteq K\\cup S) 且 (K,S) 为 (\\mathcal U_0) 内固定快照，输入无外部变异源；确定函数在相同输入下输出相同，故重放结论一致。该一致性仅证明“在给定工件下接口语义稳定”，其语义内容不超过 (K\\cup S) 所能表达的范围，因此不构成发现。∎<\/p>\n"},{"id":"03-section-9","title":"命题 2.4（发现主张的必要条件：额外不变量）","level":3,"text":"任何其支持域依赖未固定上游版本、新样例或未公开数据的断言 (b )，不能仅由 (r ) 的重放一致性支持；其成立需额外不变量 (I )，将相关外部依赖钉住或显式参数化。 证明（反例构造） 。取 (b ) 为“某结构密度的一般性结论”。设 ( mathcal U 0 ) 对应 Materials Project 快照 (S 0 ) 与算法口径 ( pi 0 )， ( mathcal U 1 ) 对应上游泛函/赝势口径变化或条目更新后的 ( pi 1/S 1 )。材料密度对结构弛豫与电子结构口径敏感（这是已知的口径依赖，而非本文新测数值），因此同一 (b ) 在 (( mathcal U 0, pi 0) ) 与 (( mathcal U 1, pi 1) ) 下可不一致；于是“重放一致”不蕴含 (b ) 的一般性。故发现性主张必须附加 (I )（上游钉住 + 算法口径溯源 + 样例覆盖声明）。∎ 评注 。命题 2.3/2.4 是 条件性规范 ：它们界定“何时只能称接口”与“称发现至少还需要什么”。本文数值（§3）全部落在命题 2.3 的支持域内。","html":"<p><em>任何其支持域依赖未固定上游版本、新样例或未公开数据的断言 (b)，不能仅由 (r) 的重放一致性支持；其成立需额外不变量 (I)，将相关外部依赖钉住或显式参数化。<\/em><\/p>\n<p><strong>证明（反例构造）<\/strong>。取 (b) 为“某结构密度的一般性结论”。设 (\\mathcal U_0) 对应 Materials Project 快照 (S_0) 与算法口径 (\\pi_0)，(\\mathcal U_1) 对应上游泛函/赝势口径变化或条目更新后的 (\\pi_1/S_1)。材料密度对结构弛豫与电子结构口径敏感（这是已知的口径依赖，而非本文新测数值），因此同一 (b) 在 ((\\mathcal U_0,\\pi_0)) 与 ((\\mathcal U_1,\\pi_1)) 下可不一致；于是“重放一致”不蕴含 (b) 的一般性。故发现性主张必须附加 (I)（上游钉住 + 算法口径溯源 + 样例覆盖声明）。∎<\/p>\n<p><strong>评注<\/strong>。命题 2.3/2.4 是<strong>条件性规范<\/strong>：它们界定“何时只能称接口”与“称发现至少还需要什么”。本文数值（§3）全部落在命题 2.3 的支持域内。<\/p>\n"},{"id":"03-section-10","title":"2.5 接口漂移指标（概念，无数值）","level":3,"text":"定义漂移指示为版本指纹与算法口径的联合签名 ( sigma=( text{lock digest}, pi) )。当且仅当 ( sigma ) 与结果绑定时，数值才具可比性。将 ( sigma ) 提升为带语义的、可跨库校验的签名，是 §4.4 的开放问题；本简报不给出其实现数值。 ---","html":"<p>定义漂移指示为版本指纹与算法口径的联合签名 (\\sigma=(\\text{lock digest},\\pi))。当且仅当 (\\sigma) 与结果绑定时，数值才具可比性。将 (\\sigma) 提升为带语义的、可跨库校验的签名，是 §4.4 的开放问题；本简报不给出其实现数值。<\/p>\n<hr>\n"},{"id":"03-section-11","title":"三、数值结果","level":2,"text":"边界声明 。本节仅呈现给定证据内的最小数值集；不提供任何证据外数字（如运行时长、硬件型号、样本量、p 值）。Z3 的两个实数不可满足约束均返回 UNSAT；RDKit 与 PubChem 的规范结构、分子式和精确质量一致，TPSA 与 LogP 差异按算法口径保留。它们分别是已知约束验证和跨库算法审计。","html":"<blockquote>\n<p><strong>边界声明<\/strong>。本节仅呈现给定证据内的最小数值集；不提供任何证据外数字（如运行时长、硬件型号、样本量、p 值）。Z3 的两个实数不可满足约束均返回 UNSAT；RDKit 与 PubChem 的规范结构、分子式和精确质量一致，TPSA 与 LogP 差异按算法口径保留。它们分别是已知约束验证和跨库算法审计。<\/p>\n<\/blockquote>\n"},{"id":"03-section-12","title":"3.1 本地引擎清点（环境审计，非性能基准）","level":3,"text":"被纳入 r‑bundle 的本地引擎数为 4 ：PySINDy、Z3、RDKit、PyMatGen。清点含义为：这些库被固定于 (L ) 所述版本与样例集之下，以构成 §2 的执行环境 ( mathcal U 0 )。该计数是 环境可重放性 的陈述，不隐含任何横向性能比较。","html":"<p>被纳入 r‑bundle 的本地引擎数为 <strong>4<\/strong>：PySINDy、Z3、RDKit、PyMatGen。清点含义为：这些库被固定于 (L) 所述版本与样例集之下，以构成 §2 的执行环境 (\\mathcal U_0)。该计数是<strong>环境可重放性<\/strong>的陈述，不隐含任何横向性能比较。<\/p>\n"},{"id":"03-section-13","title":"3.2 已知线性系统的验证（对 \\(K\\)）","level":3,"text":"PySINDy 管线在 已知线性系统 上辨识，报告 最大系数误差 varepsilon { max}=0.00003136190275787598 . 解释边界：该量度量的是“稀疏辨识 + 数值微分”的执行结果与 已知解析系数 之间的最大偏差；在固定数值微分方式与随机性处置（写入 (L )）下，它服从命题 2.3，属 验证断言 。它 不 应被读作对某未知动力系统的新建模结论；其意义是为上游提供“在该口径下，实现偏离已知答案的上界可被锚定”的接口信号。关于该误差随步长/噪声标度的系统刻画，属发现候选，超出本文支持域。 图注：PySINDy 对已知线性系统的系数恢复。 恢复系数约为 −2.00003136 与 1.00000404，最大误差 3.136×10⁻⁵。图证明的是指定实现的已知答案验证，不是从真实自然数据发现新规律。","html":"<p>PySINDy 管线在<strong>已知线性系统<\/strong>上辨识，报告<strong>最大系数误差<\/strong><\/p>\n<p>[\n\\varepsilon_{\\max}=0.00003136190275787598 .\n]<\/p>\n<p>解释边界：该量度量的是“稀疏辨识 + 数值微分”的执行结果与<strong>已知解析系数<\/strong>之间的最大偏差；在固定数值微分方式与随机性处置（写入 (L)）下，它服从命题 2.3，属<strong>验证断言<\/strong>。它<strong>不<\/strong>应被读作对某未知动力系统的新建模结论；其意义是为上游提供“在该口径下，实现偏离已知答案的上界可被锚定”的接口信号。关于该误差随步长/噪声标度的系统刻画，属发现候选，超出本文支持域。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/03_轻量可复现科研引擎/fig03a_sindy_coefficients.png\" alt=\"PySINDy 对已知线性系统的系数恢复\" loading=\"lazy\"><\/p>\n<p><em>图注：PySINDy 对已知线性系统的系数恢复。<\/em><\/p>\n<p>恢复系数约为 −2.00003136 与 1.00000404，最大误差 3.136×10⁻⁵。图证明的是指定实现的已知答案验证，不是从真实自然数据发现新规律。<\/p>\n"},{"id":"03-section-14","title":"3.3 硅密度的快照复核（对 \\(S\\)）","level":3,"text":"对固定 Materials Project 结构快照执行结构几何量重算，得密度 rho { text{recomputed}}=2.3128002565764314 text{g·cm}^{-3}, 与 同一快照 记录一致。解释边界：这是命题 2.3 下的 复核断言 ——输入快照与算法口径被 (L ) 固定，重算一致性仅表明“在该快照、该口径下，结构几何到密度的转换未漂移”。它 不是 对 Materials Project 物理正确性的独立验证/确认，也不是对新材料密度的预测；若上游结构弛豫口径或条目版本变化， ( rho ) 的可比性需重新由 ( sigma ) 判定。 图注：Materials Project 与本地 PyMatGen 的硅密度对照。 两者均为 2.3128002565764314 g/cm³，空间群重算为 Fd-3m (227)。带隙 0.6103 eV 仍标为外部 DFT 数据，未在本地重算。","html":"<p>对固定 Materials Project 结构快照执行结构几何量重算，得密度<\/p>\n<p>[\n\\rho_{\\text{recomputed}}=2.3128002565764314\\ \\text{g·cm}^{-3},\n]<\/p>\n<p>与<strong>同一快照<\/strong>记录一致。解释边界：这是命题 2.3 下的<strong>复核断言<\/strong>——输入快照与算法口径被 (L) 固定，重算一致性仅表明“在该快照、该口径下，结构几何到密度的转换未漂移”。它<strong>不是<\/strong>对 Materials Project 物理正确性的独立验证/确认，也不是对新材料密度的预测；若上游结构弛豫口径或条目版本变化，(\\rho) 的可比性需重新由 (\\sigma) 判定。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/03_轻量可复现科研引擎/fig03b_material_recompute.png\" alt=\"Materials Project 与本地 PyMatGen 的硅密度对照\" loading=\"lazy\"><\/p>\n<p><em>图注：Materials Project 与本地 PyMatGen 的硅密度对照。<\/em><\/p>\n<p>两者均为 2.3128002565764314 g/cm³，空间群重算为 Fd-3m (227)。带隙 0.6103 eV 仍标为外部 DFT 数据，未在本地重算。<\/p>\n"},{"id":"03-section-15","title":"3.4 证据汇总（最小数值集）","level":3,"text":"类别 对象 锚点数值 认识论标注 --- --- --- --- 环境 本地引擎 4 可重放性清点 验证（对 K） PySINDy 已知线性系统 最大系数误差 0.00003136190275787598 接口验证 复核（对 S） Si 结构快照 2.3128002565764314 g·cm⁻³ 快照一致 一致性仅指“与固定工件一致”；任何跨快照、跨口径或新增样例的推广均被 §2 支持域排除。 图注：HBB 与 CA II 的结构—序列映射规则。 HBB 需要去掉 UniProt 起始 M 后与 4HHB 的 146 aa 对应；CA II 则是 260 aa 全长一致。不同对齐规则必须显式声明，不能只用“相似”概括。 图注：四个轻量引擎的证据类型与限制。 PySINDy 和 Z3 是已知答案验证，RDKit 是跨库算法审计，PyMatGen 是公开快照复核。任何“发现”都需要额外数据、留出验证和独立实验。 ---","html":"<table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>对象<\/th>\n<th>锚点数值<\/th>\n<th>认识论标注<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>环境<\/td>\n<td>本地引擎<\/td>\n<td>4<\/td>\n<td>可重放性清点<\/td>\n<\/tr>\n<tr>\n<td>验证（对 K）<\/td>\n<td>PySINDy 已知线性系统<\/td>\n<td>最大系数误差 0.00003136190275787598<\/td>\n<td>接口验证<\/td>\n<\/tr>\n<tr>\n<td>复核（对 S）<\/td>\n<td>Si 结构快照<\/td>\n<td>2.3128002565764314 g·cm⁻³<\/td>\n<td>快照一致<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>一致性仅指“与固定工件一致”；任何跨快照、跨口径或新增样例的推广均被 §2 支持域排除。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/03_轻量可复现科研引擎/fig03c_sequence_bridges.png\" alt=\"HBB 与 CA II 的结构—序列映射规则\" loading=\"lazy\"><\/p>\n<p><em>图注：HBB 与 CA II 的结构—序列映射规则。<\/em><\/p>\n<p>HBB 需要去掉 UniProt 起始 M 后与 4HHB 的 146 aa 对应；CA II 则是 260 aa 全长一致。不同对齐规则必须显式声明，不能只用“相似”概括。<\/p>\n<p><img class=\"paper-image\" src=\"../../assets/papers/03_轻量可复现科研引擎/fig03d_evidence_boundaries.png\" alt=\"四个轻量引擎的证据类型与限制\" loading=\"lazy\"><\/p>\n<p><em>图注：四个轻量引擎的证据类型与限制。<\/em><\/p>\n<p>PySINDy 和 Z3 是已知答案验证，RDKit 是跨库算法审计，PyMatGen 是公开快照复核。任何“发现”都需要额外数据、留出验证和独立实验。<\/p>\n<hr>\n"},{"id":"03-section-16","title":"4.1 “不冒充新发现”是方法特性","level":3,"text":"将产出限定在 (K cup S ) 支持域内，会牺牲叙述上的“新颖性”，但换来三点审计收益：其一，断言与证据之间的映射是 一一显式 的；其二，上游可在不改变科学结论的前提下替换实现，而接口承诺仍可被检验；其三，读者不会被引导把“重算一致”误读为“理论确认”。这与 ACM artifact badging 的精神一致：徽章标识的是工件可检查性，而非结论的新颖性等级。","html":"<p>将产出限定在 (K\\cup S) 支持域内，会牺牲叙述上的“新颖性”，但换来三点审计收益：其一，断言与证据之间的映射是<strong>一一显式<\/strong>的；其二，上游可在不改变科学结论的前提下替换实现，而接口承诺仍可被检验；其三，读者不会被引导把“重算一致”误读为“理论确认”。这与 ACM artifact badging 的精神一致：徽章标识的是工件可检查性，而非结论的新颖性等级。<\/p>\n"},{"id":"03-section-17","title":"4.2 与 FAIR / artifact review 的关系","level":3,"text":"FAIR（Wilkinson et al., 2016）要求对象可发现、可访问、可互操作、可复用；artifact review 要求工件可被第三方检查。r‑bundle 是其面向 接口 的轻量子集：它弱化“完整研究对象”的要求，强化“固定工件下的语义不变量”。这一弱化是刻意的——在工具链协作场景中，上游通常无法承诺下游科学命题，但能承诺“在我的快照上，你的调用意义没变”。","html":"<p>FAIR（Wilkinson et al., 2016）要求对象可发现、可访问、可互操作、可复用；artifact review 要求工件可被第三方检查。r‑bundle 是其面向<strong>接口<\/strong>的轻量子集：它弱化“完整研究对象”的要求，强化“固定工件下的语义不变量”。这一弱化是刻意的——在工具链协作场景中，上游通常无法承诺下游科学命题，但能承诺“在我的快照上，你的调用意义没变”。<\/p>\n"},{"id":"03-section-18","title":"4.3 局限与风险（显式列账）","level":3,"text":"1. 版本与样例锁定 ：结果仅限指定版本与样例；任何升级、补丁或样例扩充都必须触发 (L ) 与 ( sigma ) 的重新签发。 2. 算法口径必须随结果保存 ：密度重算的可比性依赖结构弛豫状态与电子结构口径；若上游口径变更而结果未同步携带口径元数据，数值将失去可比性。 3. 覆盖偏差 ：最小数值集是锚点而非覆盖面；它对“接口未漂移”是必要非充分的统计证据。 4. 浮点一致性为工程假设 ：命题 2.3 将确定性建立在“实现定义浮点一致性”上；跨硬件/跨 BLAS 的严格位级一致不是本简报的承诺。","html":"<ol>\n<li><strong>版本与样例锁定<\/strong>：结果仅限指定版本与样例；任何升级、补丁或样例扩充都必须触发 (L) 与 (\\sigma) 的重新签发。<\/li>\n<li><strong>算法口径必须随结果保存<\/strong>：密度重算的可比性依赖结构弛豫状态与电子结构口径；若上游口径变更而结果未同步携带口径元数据，数值将失去可比性。<\/li>\n<li><strong>覆盖偏差<\/strong>：最小数值集是锚点而非覆盖面；它对“接口未漂移”是必要非充分的统计证据。<\/li>\n<li><strong>浮点一致性为工程假设<\/strong>：命题 2.3 将确定性建立在“实现定义浮点一致性”上；跨硬件/跨 BLAS 的严格位级一致不是本简报的承诺。<\/li>\n<\/ol>\n"},{"id":"03-section-19","title":"4.4 开放问题（待验证）","level":3,"text":"- 语义化漂移签名 ：能否将 §2.5 的 ( sigma ) 升级为可跨库机器校验、且对算法口径变化敏感的签名？（开放） - 多包传递性 ：当多个 r‑bundle 串联时，接口一致性是否在复合下保持？一般情形下不保持；寻找可判定的充分条件。（待验证） - 验证误差标度律 ： ( varepsilon { max} ) 对数值微分步长与噪声的标度，属发现候选，需独立不变量后方可陈述。（开放） ---","html":"<ul>\n<li><strong>语义化漂移签名<\/strong>：能否将 §2.5 的 (\\sigma) 升级为可跨库机器校验、且对算法口径变化敏感的签名？（开放）<\/li>\n<li><strong>多包传递性<\/strong>：当多个 r‑bundle 串联时，接口一致性是否在复合下保持？一般情形下不保持；寻找可判定的充分条件。（待验证）<\/li>\n<li><strong>验证误差标度律<\/strong>：(\\varepsilon_{\\max}) 对数值微分步长与噪声的标度，属发现候选，需独立不变量后方可陈述。（开放）<\/li>\n<\/ul>\n<hr>\n"},{"id":"03-section-20","title":"五、结论","level":2,"text":"本文给出一个克制的协作方法：以 r‑bundle 将已知答案、公开快照与限制清单固化为可重放工件，并把一切产出断言归入验证、复核或发现三类。给定证据内：本地引擎为 4；PySINDy 对已知线性系统的最大系数误差为 0.00003136190275787598（验证）；硅密度重算为 2.3128002565764314 g·cm⁻³，与固定快照一致（复核）。这些结论在固定版本与固定样例下成立；上游数据与算法口径必须随结果保存。可重放包的恰当定位是向上游提供 验证与接口 ，而不是索取 新科学发现 的名义；后者只有在满足命题 2.4 的额外不变量时才可被主张。 ---","html":"<p>本文给出一个克制的协作方法：以 r‑bundle 将已知答案、公开快照与限制清单固化为可重放工件，并把一切产出断言归入验证、复核或发现三类。给定证据内：本地引擎为 4；PySINDy 对已知线性系统的最大系数误差为 0.00003136190275787598（验证）；硅密度重算为 2.3128002565764314 g·cm⁻³，与固定快照一致（复核）。这些结论在固定版本与固定样例下成立；上游数据与算法口径必须随结果保存。可重放包的恰当定位是向上游提供<strong>验证与接口<\/strong>，而不是索取<strong>新科学发现<\/strong>的名义；后者只有在满足命题 2.4 的额外不变量时才可被主张。<\/p>\n<hr>\n"},{"id":"03-section-21","title":"参考文献","level":2,"text":"1 de Silva B, Champion K, Quade M, et al. PySINDy: A Python package for the sparse identification of nonlinear dynamical systems from data. Journal of Open Source Software, 2020, 5(49):2104. DOI: 10.21105/joss.02104。 2 Kaptanoglu AA, de Silva BM, Fasel U, et al. PySINDy: A comprehensive Python package for robust sparse system identification. Journal of Open Source Software, 2022, 7(69):3994. DOI: 10.21105/joss.03994。 3 PySINDy contributors. PySINDy 2.1.0：本地线性库与 STLSQ 验证。https://github.com/dynamicslab/pysindy 4 Z3 contributors. Z3 5.3.3.0：实数约束求解与 UNSAT 结果。https://github.com/Z3Prover/z3 5 RDKit contributors. RDKit 2026.9.1：规范结构与分子描述符。https://github.com/rdkit/rdkit 6 Materials Project. PyMatGen 2026.10.24：结构、密度与空间群分析。https://github.com/materialsproject/pymatgen 7 Jain A, Ong SP, Hautier G, Chen W, Richards WD, et al. Commentary: The Materials Project: A materials genome approach to accelerating materials innovation. APL Materials, 2013, 1(1). DOI: 10.1063/1.4812323。 8 RCSB PDB 与 UniProt Consortium：4HHB/HBB HUMAN、3HS4/CAH2 HUMAN 的结构与 reviewed 序列快照。https://data.rcsb.org/rest/v1/core；https://rest.uniprot.org 9 本研究全部机器可读结果： validation/pysindy.json 、 validation/z3.json 、 validation/rdkit.json 、 validation/pymatgen.json 、 validation/pdb-uniprot.json 、 validation/ca2-sequence.json 。 10 Barba LA. Terminologies for Reproducible Research. arXiv:1802.03311, 2018. DOI: 10.48550/arXiv.1802.03311。 11 Plesser HE. Reproducibility vs. Replicability: A Brief History of a Confused Terminology. Frontiers in Neuroinformatics, 2018, 11. DOI: 10.3389/fninf.2017.00076。 12 National Academies of Sciences, Engineering, and Medicine. Reproducibility and Replicability in Science. National Academies Press, 2019. DOI: 10.17226/25303。 13 Roache PJ. Verification and Validation in Computational Science and Engineering. Hermosa Publishers, 1998. ISBN: 0913478083（Open Library OL400789M 目录核对）。 14 Oberkampf WL, Trucano TG. Verification and validation in computational fluid dynamics. Progress in Aerospace Sciences, 2002, 38(3):209–272. DOI: 10.1016/S0376-0421(02)00005-2。 15 Brunton SL, Proctor JL, Kutz JN. Discovering governing equations from data by sparse identification of nonlinear dynamical systems. Proceedings of the National Academy of Sciences, 2016, 113(15):3932–3937. DOI: 10.1073/pnas.1517384113。 16 de Moura L, Bjørner N. Z3: An Efficient SMT Solver. Lecture Notes in Computer Science, 2008:337–340. DOI: 10.1007/978-3-540-78800-3 24。 17 Ong SP, Richards WD, Jain A, et al. Python Materials Genomics (pymatgen): A robust, open-source python library for materials analysis. Computational Materials Science, 2013, 68:314–319. DOI: 10.1016/j.commatsci.2012.10.028。 18 Wilkinson MD, Dumontier M, Aalbersberg IJ, et al. The FAIR Guiding Principles for scientific data management and stewardship. Scientific Data, 2016, 3. DOI: 10.1038/sdata.2016.18。 19 Association for Computing Machinery. Artifact Review and Badging Version 1.1, 2020-08-24. https://www.acm.org/publications/policies/artifact-review-and-badging-current（ACM 官方政策页面回读）。","html":"<p>[1] de Silva B, Champion K, Quade M, et al. PySINDy: A Python package for the sparse identification of nonlinear dynamical systems from data. Journal of Open Source Software, 2020, 5(49):2104. DOI: 10.21105/joss.02104。\n[2] Kaptanoglu AA, de Silva BM, Fasel U, et al. PySINDy: A comprehensive Python package for robust sparse system identification. Journal of Open Source Software, 2022, 7(69):3994. DOI: 10.21105/joss.03994。\n[3] PySINDy contributors. PySINDy 2.1.0：本地线性库与 STLSQ 验证。<a href=\"https://github.com/dynamicslab/pysindy\" target=\"_blank\" rel=\"noreferrer noopener\">https://github.com/dynamicslab/pysindy<\/a>\n[4] Z3 contributors. Z3 5.3.3.0：实数约束求解与 UNSAT 结果。<a href=\"https://github.com/Z3Prover/z3\" target=\"_blank\" rel=\"noreferrer noopener\">https://github.com/Z3Prover/z3<\/a>\n[5] RDKit contributors. RDKit 2026.9.1：规范结构与分子描述符。<a href=\"https://github.com/rdkit/rdkit\" target=\"_blank\" rel=\"noreferrer noopener\">https://github.com/rdkit/rdkit<\/a>\n[6] Materials Project. PyMatGen 2026.10.24：结构、密度与空间群分析。<a href=\"https://github.com/materialsproject/pymatgen\" target=\"_blank\" rel=\"noreferrer noopener\">https://github.com/materialsproject/pymatgen<\/a>\n[7] Jain A, Ong SP, Hautier G, Chen W, Richards WD, et al. Commentary: The Materials Project: A materials genome approach to accelerating materials innovation. APL Materials, 2013, 1(1). DOI: 10.1063/1.4812323。\n[8] RCSB PDB 与 UniProt Consortium：4HHB/HBB_HUMAN、3HS4/CAH2_HUMAN 的结构与 reviewed 序列快照。<a href=\"https://data.rcsb.org/rest/v1/core；https://rest.uniprot.org\" target=\"_blank\" rel=\"noreferrer noopener\">https://data.rcsb.org/rest/v1/core；https://rest.uniprot.org<\/a>\n[9] 本研究全部机器可读结果：<code>validation/pysindy.json<\/code>、<code>validation/z3.json<\/code>、<code>validation/rdkit.json<\/code>、<code>validation/pymatgen.json<\/code>、<code>validation/pdb-uniprot.json<\/code>、<code>validation/ca2-sequence.json<\/code>。\n[10] Barba LA. Terminologies for Reproducible Research. arXiv:1802.03311, 2018. DOI: 10.48550/arXiv.1802.03311。\n[11] Plesser HE. Reproducibility vs. Replicability: A Brief History of a Confused Terminology. Frontiers in Neuroinformatics, 2018, 11. DOI: 10.3389/fninf.2017.00076。\n[12] National Academies of Sciences, Engineering, and Medicine. Reproducibility and Replicability in Science. National Academies Press, 2019. DOI: 10.17226/25303。\n[13] Roache PJ. Verification and Validation in Computational Science and Engineering. Hermosa Publishers, 1998. ISBN: 0913478083（Open Library OL400789M 目录核对）。\n[14] Oberkampf WL, Trucano TG. Verification and validation in computational fluid dynamics. Progress in Aerospace Sciences, 2002, 38(3):209–272. DOI: 10.1016/S0376-0421(02)00005-2。\n[15] Brunton SL, Proctor JL, Kutz JN. Discovering governing equations from data by sparse identification of nonlinear dynamical systems. Proceedings of the National Academy of Sciences, 2016, 113(15):3932–3937. DOI: 10.1073/pnas.1517384113。\n[16] de Moura L, Bjørner N. Z3: An Efficient SMT Solver. Lecture Notes in Computer Science, 2008:337–340. DOI: 10.1007/978-3-540-78800-3_24。\n[17] Ong SP, Richards WD, Jain A, et al. Python Materials Genomics (pymatgen): A robust, open-source python library for materials analysis. Computational Materials Science, 2013, 68:314–319. DOI: 10.1016/j.commatsci.2012.10.028。\n[18] Wilkinson MD, Dumontier M, Aalbersberg IJ, et al. The FAIR Guiding Principles for scientific data management and stewardship. Scientific Data, 2016, 3. DOI: 10.1038/sdata.2016.18。\n[19] Association for Computing Machinery. Artifact Review and Badging Version 1.1, 2020-08-24. <a href=\"https://www.acm.org/publications/policies/artifact-review-and-badging-current（ACM\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.acm.org/publications/policies/artifact-review-and-badging-current（ACM<\/a> 官方政策页面回读）。<\/p>\n"},{"id":"03-section-22","title":"附录 A：复现路径","level":2,"text":"1. 在 D 盘隔离环境分别运行 verify pysindy.py 、 verify z3.py 、 verify rdkit.py 和 verify pymatgen.py ；依赖锁定见 requirements/ 。 2. 运行 python scripts/verify pdb uniprot.py 与 python scripts/verify ca2 sequence.py ，复核两类序列对齐规则。 3. 运行 python scripts/export evidence packet.py --check 、 python scripts/build catalog.py --check 和 python -m unittest discover -s tests -v ，确认统一证据包未漂移。 4. 图由 python scripts/build paper figures.py 从保存的 JSON 重新计算，不使用手工填写的 mock 数据。 5. 所有结果只限指定版本、样例和算法口径；真实数据发现需要另行设计留出验证与独立实验。","html":"<ol>\n<li>在 D 盘隔离环境分别运行 <code>verify_pysindy.py<\/code>、<code>verify_z3.py<\/code>、<code>verify_rdkit.py<\/code> 和 <code>verify_pymatgen.py<\/code>；依赖锁定见 <code>requirements/<\/code>。<\/li>\n<li>运行 <code>python scripts/verify_pdb_uniprot.py<\/code> 与 <code>python scripts/verify_ca2_sequence.py<\/code>，复核两类序列对齐规则。<\/li>\n<li>运行 <code>python scripts/export_evidence_packet.py --check<\/code>、<code>python scripts/build_catalog.py --check<\/code> 和 <code>python -m unittest discover -s tests -v<\/code>，确认统一证据包未漂移。<\/li>\n<li>图由 <code>python scripts/build_paper_figures.py<\/code> 从保存的 JSON 重新计算，不使用手工填写的 mock 数据。<\/li>\n<li>所有结果只限指定版本、样例和算法口径；真实数据发现需要另行设计留出验证与独立实验。<\/li>\n<\/ol>\n"}]}]}}</script>
<script>
(() => {
  const {kind,data} = JSON.parse(document.getElementById('explorer-data').textContent);
  const main = document.getElementById('explorer-main');
  const nf = new Intl.NumberFormat('zh-CN');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const metric = (value,label) => `<div class="metric"><strong class="metric-value">${esc(value)}</strong><span class="metric-label">${esc(label)}</span></div>`;
  const badge = (text,kind='') => `<span class="badge${kind?` badge--${kind}`:''}">${esc(text)}</span>`;
  const empty = text => `<p class="empty">${esc(text)}</p>`;
  const state = {paper:0,section:0,query:'',figures:false,matched:false,visible:12,projectQuery:'',domain:'all',adoption:'all',localStatus:'all',selected:null,recordQuery:'',evidence:'all',recordDomain:'all',budget:null};
  function openImage(src,caption){
    const dialog = document.getElementById('image-dialog');
    document.getElementById('dialog-image').src = src;
    document.getElementById('dialog-image').alt = caption;
    document.getElementById('dialog-caption').textContent = caption;
    dialog.showModal();
  }
  document.getElementById('close-image').addEventListener('click',()=>document.getElementById('image-dialog').close());
  document.getElementById('image-dialog').addEventListener('click',event=>{if(event.target.id==='image-dialog')event.target.close();});
  function figureGrid(figures){return `<div class="figure-grid">${figures.map(figure=>`<button type="button" class="figure-card" data-image="${esc(figure.src)}" data-caption="${esc(figure.alt)}"><img src="${esc(figure.src)}" alt="${esc(figure.alt)}" loading="lazy"><span class="code">${esc(figure.filename)}</span></button>`).join('')}</div>`;}
  function renderPapers(){
    const paper = data.papers[state.paper];
    const section = paper.sections[state.section] || paper.sections[0];
    const matches = state.query ? paper.sections.map((item,index)=>({item,index})).filter(({item})=>`${item.title} ${item.text}`.toLowerCase().includes(state.query.toLowerCase())) : [];
    let content;
    if(state.figures) content = `<h2>${esc(paper.title)} · ${paper.figures.length} 幅图</h2>${figureGrid(paper.figures)}`;
    else if(state.query) content = `<h2>“${esc(state.query)}”的章节结果</h2><p class="muted small">找到 ${matches.length} 个章节；检索标题和正文，不修改原文。</p>${matches.length?matches.map(({item,index})=>`<button type="button" class="search-result" data-section="${index}"><strong>${esc(item.title)}</strong><small>${esc(item.text.slice(0,220))}${item.text.length>220?'……':''}</small></button>`).join(''):empty('本篇没有匹配章节，可缩短关键词。')}`;
    else content = `<nav class="chips" aria-label="论文章节">${paper.sections.map((item,index)=>`<button type="button" class="kimi-chip" data-section="${index}" aria-pressed="${index===state.section}">${esc(item.title)}</button>`).join('')}</nav><article class="paper-content">${section.html}</article>`;
    main.innerHTML = `<form class="toolbar" data-form="paper-search"><div class="field"><label for="paper-select">选择论文</label><select class="kimi-select" id="paper-select" name="paper">${data.papers.map((item,index)=>`<option value="${index}" ${index===state.paper?'selected':''}>${esc(item.title)}</option>`).join('')}</select></div><div class="field"><label for="paper-query">本篇全文检索</label><input class="kimi-input" id="paper-query" name="query" value="${esc(state.query)}" placeholder="例如：独立重复"></div><button class="kimi-button kimi-button--primary" type="submit">查找章节</button><button class="kimi-button" type="button" data-action="figures">${state.figures?'返回正文':'查看图件'}</button></form><p>${badge(data.status,'warning')}</p>${content}`;
  }
  function activityDetails(pair){
    return `<details class="details"><summary>${esc(pair.document_chembl_id)} · ${esc(pair.year)} · activity ${esc(pair.ca_i_activity)}/${esc(pair.ca_ii_activity)}</summary><div class="table-scroll"><table class="data-table"><thead><tr><th>靶点</th><th>Ki（nM）</th><th>方法</th><th>重复标记</th></tr></thead><tbody><tr><td>CA I</td><td class="number">${esc(pair.ca_i_ki_nM)}</td><td>${esc(pair.ca_i_method)}</td><td>${esc(pair.ca_i_duplicate)}</td></tr><tr><td>CA II</td><td class="number">${esc(pair.ca_ii_ki_nM)}</td><td>${esc(pair.ca_ii_method)}</td><td>${esc(pair.ca_ii_duplicate)}</td></tr></tbody></table></div><p class="small">record_id：${esc(pair.record_id)}。该比值仅属于此文档内的表观配对，不是独立重复统计。</p></details>`;
  }
  function renderActivity(){
    const d = data.stability;
    const pairs = d.pairs.filter(pair=>!state.matched || pair.method_status==='explicit_matched');
    const ix = data.selectivity.ca_ix;
    main.innerHTML = `<div class="metrics">${metric(d.document_count,'文档内配对')}${metric(`${Number(d.ratio_min.toFixed(4))}–${d.ratio_max}`,'表观 Ki 比值')}${metric(`${d.max_min_fold} 倍`,'观察极差')}${metric(`${d.strict_method_matched_count}/${d.document_count}`,'明确同酯酶方法')}</div><p class="notice">${esc(d.scope)}</p><div class="toolbar"><label><input type="checkbox" id="matched-only" ${state.matched?'checked':''}> 仅显示明确同酯酶方法</label></div><h2>CA I Ki ÷ CA II Ki</h2>${pairs.length?pairs.map(pair=>`<div class="activity-row"><div><strong>${esc(pair.document_chembl_id)}</strong><div class="small muted">${pair.method_status==='explicit_matched'?'明确同方法':'方法信息不足'}</div></div><div class="bar-track" role="img" aria-label="表观比值 ${esc(pair.ki_ratio.toFixed(4))}，六组最大值为 75"><div class="bar-fill" style="--bar:${(pair.ki_ratio/d.ratio_max*100).toFixed(3)}%"></div></div><span class="number">${esc(pair.ki_ratio.toFixed(4))}</span></div>${activityDetails(pair)}`).join(''):empty('当前筛选没有记录。')}<details class="details"><summary>CA IX 单列：不同方法，不计算统一选择性比</summary><p>CA IX Ki = <strong>${esc(ix.ki_nM)} nM</strong>；方法为 ${esc(ix.assay_method)}；pChEMBL ${esc(ix.pchembl)}；potential_duplicate=${esc(ix.potential_duplicate)}。</p><p class="small">${esc(data.selectivity.ca_ix_comparison)}。CA I/II 的 ΔpChEMBL=${esc(data.selectivity.ca_ii_minus_ca_i_pchembl_delta)}，仅对应同文档同酯酶配对。</p></details><p class="small muted">未进行中位数或荟萃合并估计；重复标记不作为剔除或造假证据。</p>`;
  }
  function renderStructure(){
    const d=data;
    const labels={terminal_deletion:'起始甲硫氨酸缺失',substitution:'H94N 替换',insertion:'参考位置 200 后插入 P'};
    main.innerHTML=`<div class="metrics">${metric(`${d.reference.pdb_id} · ${d.reference.resolution_A} Å`,'野生型参考结构')}${metric(`${d.control.pdb_id} · ${d.control.resolution_A} Å`,'不同构建对照')}${metric(d.alignment_difference_event_count,'三类序列差异')}${metric(`${d.sequence_string_length}/${d.metadata_sample_sequence_length}`,'序列长度／元数据长度')}</div><p class="notice">${esc(d.scope)}</p><h2>逐项差异</h2><ul class="diff-list">${d.sequence_differences.map(diff=>`<li><strong>${esc(labels[diff.type]||diff.type)}</strong><p class="small">参考：${esc(diff.reference)}<br>对照：${esc(diff.control)}${diff.position?`<br>位置：${esc(diff.position)}`:''}${diff.after_reference_position?`<br>位于参考位置 ${esc(diff.after_reference_position)} 之后`:''}</p></li>`).join('')}</ul><p class="small">${esc(d.shared)}。exact_wildtype_replication = <code>${esc(d.exact_wildtype_replication)}</code>。</p><details class="details"><summary>查看完整对齐区间与排除候选</summary><div class="table-scroll"><table class="data-table"><thead><tr><th>操作</th><th>参考索引</th><th>对照索引</th></tr></thead><tbody>${d.alignment_opcodes.map(op=>`<tr><td class="code">${esc(op[0])}</td><td class="number">${esc(op[1])}–${esc(op[2])}</td><td class="number">${esc(op[3])}–${esc(op[4])}</td></tr>`).join('')}</tbody></table></div><p class="small muted">索引采用 Python 切片约定，右端不包含；插入区间的解释以逐项差异为准。</p><h3>排除候选</h3><ul>${d.excluded_candidates.map(item=>`<li><code>${esc(item.pdb_id)}</code>：${esc(item.reason)}</li>`).join('')}</ul></details><p class="small">参考 DOI：${esc(d.reference.primary_citation_doi)}<br>对照 DOI：${esc(d.control.primary_citation_doi)}<br>采集日期：${esc(d.reference.data_collection_date)}／${esc(d.control.data_collection_date)}</p>`;
  }
  const domainLabels={national:'国家计划',biology:'生物',math:'数学',science:'科学智能',physics:'物理',infrastructure:'基础设施',chemistry:'化学',cross:'跨域'};
  function renderProjects(){
    const filtered=data.projects.filter(project=>(state.domain==='all'||project.domain===state.domain)&&(state.adoption==='all'||project.adoption===state.adoption)&&(state.localStatus==='all'||project.localStatus===state.localStatus)&&(!state.projectQuery||`${project.name} ${project.owner} ${project.collaboration} ${project.notes}`.toLowerCase().includes(state.projectQuery.toLowerCase())));
    const shown=filtered.slice(0,state.visible);
