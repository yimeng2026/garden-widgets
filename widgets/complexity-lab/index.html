<style>
.research-widget{width:100%;font-family:var(--kimi-font-sans);color:var(--kimi-color-text-primary);padding-block-start:var(--kimi-space-4);padding-inline:var(--kimi-space-4);padding-block-end:var(--kimi-space-4);box-sizing:border-box}.research-widget *{box-sizing:border-box}.research-widget button,.research-widget input,.research-widget select,.research-widget textarea{font:inherit}.research-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--kimi-space-3)}.research-title{margin:0;font-size:20px;line-height:28px;font-weight:500}.research-subtitle{margin:var(--kimi-space-1) 0 0;color:var(--kimi-color-text-secondary);font-size:14px;line-height:20px}.research-count{flex:none}.research-tabs{display:flex;gap:var(--kimi-space-1);overflow-x:auto;padding-block:var(--kimi-space-4) var(--kimi-space-3);border-bottom:1px solid var(--kimi-color-border)}.research-tabs .kimi-chip{flex:none}.research-main{padding-block-start:var(--kimi-space-4)}.research-status-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--kimi-space-2)}.research-status{display:inline-flex;align-items:center;justify-content:center;min-height:22px;padding-inline:var(--kimi-space-2);border-radius:var(--kimi-radius-chip);font-size:12px;border:1px solid var(--kimi-color-border);color:var(--kimi-color-text-secondary)}.research-status--positive{color:var(--kimi-color-positive);background:color-mix(in srgb,var(--kimi-color-positive) 10%,transparent)}.research-status--warning{color:var(--kimi-color-warning);background:color-mix(in srgb,var(--kimi-color-warning) 12%,transparent)}.research-status--danger{color:var(--kimi-color-danger);background:color-mix(in srgb,var(--kimi-color-danger) 10%,transparent)}.research-status--accent{color:var(--kimi-color-accent);background:color-mix(in srgb,var(--kimi-color-accent) 10%,transparent)}.research-case-title{margin:var(--kimi-space-3) 0 var(--kimi-space-2);font-size:17px;line-height:24px;font-weight:500}.research-summary{margin:0;color:var( font-size:12px;margin-block-end:var(--kimi-space-1)}.research-sources{margin:var(--kimi-space-2) 0 0;padding-inline-start:var(--kimi-space-4);color:var(--kimi-color-text-secondary);font-size:12px;line-height:18px}.research-code{font-family:var(--kimi-font-mono);font-size:12px;overflow-wrap:anywhere}.research-rules{margin-block-start:var(--kimi-space-4);padding-block-start:var(--kimi-space-3);border-top:1px solid var(--kimi-color-border)}.research-rules ul{margin:0;padding-inline-start:var(--kimi-space-4);color:var(--kimi-color-text-secondary);font-size:12px;line-height:18px}@media(max-width:560px){.research-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.research-metric:nth-child(3){padding-inline-start:0;border-inline-start:0}.research-head{display:block}.research-count{margin-block-start:var(--kimi-space-2);display:inline-flex}}

<body>
<div class="research-widget">
  <header class="research-head"><div><h1 class="research-title">复杂性与证据控制</h1><p class="research-subtitle">控制论 · 形式模型 · 尺度与典型性 · 独立复核</p></div><span class="research-status research-count">4 个研究视图</span></header>
  <nav class="research-tabs" id="research-tabs" aria-label="研究视图"></nav>
  <main class="research-main" id="research-main" aria-live="polite"><h2 class="research-case-title">智能体控制论：把控制对象从输出扩展到证据生成过程</h2><p class="research-summary">真实仓库属于 dpsnet。书籍的价值在于工程公理、实验与开放问题的分层，而不是宣称提示词时代已经结束。</p></main>
</div>
<script type="application/json" id="research-data">{"schemaVersion":1,"snapshotType":"research_narrative","title":"复杂性与证据控制","subtitle":"控制论 · 形式模型 · 尺度与典型性 · 独立复核","cases":[{"id":"control","label":"控制论与花园","status":"证据分层","tone":"accent","title":"智能体控制论：把控制对象从输出扩展到证据生成过程","summary":"真实仓库属于 dpsnet。书籍的价值在于工程公理、实验与开放问题的分层，而不是宣称提示词时代已经结束。","metrics":[{"value":"24","label":"设计模式","note":"覆盖 9 个模式族"},{"value":"117+1","label":"Lean 声明","note":"静态计数与文章一致"},{"value":"0","label":"本机 Lean 构建","note":"工具链不可用，未声称复现"},{"value":"4","label":"控制闸门","note":"现实、权限、时间、晋升"}],"sections":[{"title":"四条可执行映射","items":["物理非信任 → 真实测试、构建、API 冒烟与远端回读，不能由模型自报替代。","注意力约束 → 组件拆出主仓库，减少依赖和权限投影；拆仓库本身不证明经验定律。","因果单调 → 不可覆盖 ID、版本化快照和 SHA-256，保留状态血缘。","经验自免疫 → 默认隔离、有限状态、失败历史和独立复核门禁。"]},{"title":"来源与证据边界","items":["KrisTHL181 的 18 个公开仓库中未发现本书；实际仓库为 dpsnet/industrial-agentic-cybernetics。","源码静态扫描未见 axiom、sorry 或 admit；Actions 可见记录是 Pages 部署，不是 Lean 构建。","作者主动声明模型—现实映射、经验阈值和跨通道耦合仍未闭合，这些开放项必须保留。"]}],"boundary":"书籍与实验材料公开可审计，不等于全部公理和实验已由第三方独立验证。","nextAction":"用独立 Lean 工具链实际构建并执行 #print axioms，再选择一条实验做第三方重复。","sources":[{"label":"书籍仓库","locator":"github.com/dpsnet/industrial-agentic-cybernetics"},{"label":"Lean 静态证据","locator":"formal_proof/IACFormalization/src"}]},{"id":"formal","label":"诺顿与形式化","status":"模型边界","tone":"warning","title":"形式化不会替物理挑选合法解","summary":"诺顿穹顶在同一初值下存在静止与延迟启动解；问题不只是方程，而是模型类、解概念、物理约束和观测语义。","metrics":[{"value":"√r","label":"加速度方程","note":"r(0)=0，ṙ(0)=0"},{"value":"2 类","label":"合法轨迹","note":"静止与任意 T 延迟启动"},{"value":"5 层","label":"形式化栈","note":"语法、模型、语义、证据、选择"},{"value":"2 条","label":"蒙太古线索","note":"自然语言语义与形式物理不可混淆"}],"sections":[{"title":"数学事实","items":["典型形式为 ddot r=√r；静止解与 r(t)=(t−T)^4/144 的延迟启动解并存。","√r 在顶点不满足保证唯一性的 Lipschitz 条件，因此不能援引标准唯一性定理删除延迟解。","非唯一解不直接证明自然界无因果；补充约束也需独立依据，不能只为得到喜欢的答案。"]},{"title":"对形式化研究的约束","items":["语法可表达 ≠ 模型类明确 ≠ 物理语义成立 ≠ 实验验证完成。","机器检验可以验证编码后的推导，却不能自动证明建模选择与观测映射。","智能体多轨迹与诺顿非唯一解只能作结构类比，不能解释成自由意志或同一物理机制。"]}],"boundary":"形式系统的多个合法解需要独立的物理选择规则；形式化本身不提供该规则。","nextAction":"把每个物理形式化项目拆成语法、模型、语义、证据和选择五张卡，缺一张就不得晋升。","sources":[{"label":"非唯一解与 Lipschitz 边界","locator":"arxiv.org/pdf/2011.01450"},{"label":"模型类讨论","locator":"philsci-archive.pitt.edu/8833/4/dome_100711.pdf"}]},{"id":"complexity","label":"复杂性三机制","status":"多尺度验证","tone":"positive","title":"与复杂性共存：概率、典型性与结构控制不是同一件事","summary":"Quanta 的年度三项选择展示三种互补机制：病态历史统计权重、极端对象测度控制、确定结构的多尺度分解。","metrics":[{"value":"3","label":"年度数学工作","note":"不是唯一的最重大排名"},{"value":"1/4−ε","label":"近最优谱隙","note":"概率趋一，不是恒成立"},{"value":"3","label":"Kakeya 维数","note":"仅三维，不是任意维"},{"value":"3 类","label":"评估口径","note":"平均、尾风险、最坏状态"}],"sections":[{"title":"三项结果及其边界","items":["Deng–Hani–Ma：在具体硬球与极限框架下贯通 Newton→Boltzmann→流体方程，是希尔伯特第六问题的重要情形。","Anantharaman–Monk：随机双曲曲面以趋近 1 的概率具有 λ1≥1/4−ε，是典型性而非逐对象结论。","Wang–Zahl：每个三维 Kakeya 集的 Minkowski 与 Hausdorff 维数均为 3；高维与相关极大函数猜想仍开放。"]},{"title":"对智能体评估的改造","items":["平均任务成功率描述典型表现，不能掩盖低概率灾难路径。","尾部失败需要概率模型和暴露量，不能把存在反例等同于整体失效。","最坏状态需要形式不变量与安全闸门，不能用平均准确率替代。"]}],"boundary":"与复杂性共存不是降低严格性，而是明确每个结论属于概率、典型性还是 worst-case。","nextAction":"所有新评测同时报告平均成功率、尾部失败和最坏状态不变量，拒绝单一总分。","sources":[{"label":"流体方程","locator":"arxiv.org/abs/2503.01800"},{"label":"随机双曲曲面","locator":"arxiv.org/abs/2502.12268"},{"label":"三维 Kakeya","locator":"arxiv.org/html/2502.17655v1"}]},{"id":"public","label":"公开框架审查","status":"待独立复核","tone":"warning","title":"罗文俊·探索者：保留可证伪入口，把宏大叙事拆成可淘汰对象","summary":"公开系列展示跨域构造和部分负结果，但三代、热机、意识、曲率泡等主张不能仅凭统一术语或拟合升级为已验证理论。","metrics":[{"value":"17–25","label":"本轮主题编号","note":"公开索引中的相关系列"},{"value":"3","label":"优先定点","note":"三代计数、冷原子、暗物质"},{"value":"0","label":"本轮独立物理复现","note":"未将作者自述当作第三方验证"},{"value":"18","label":"Kris 公开仓库","note":"未发现本书归属关系"}],"sections":[{"title":"值得保留的研究习惯","items":["尝试给出冷原子和暗物质等可证伪入口，并在宇宙学部分承认若干拟合机制未达所需量级。","统一网络语言可作为候选结构生成器，但必须先证明观测映射和独立预测。"]},{"title":"三项代表性证据边界","items":["Witten 全局反常给出双态奇偶约束，不唯一指定三代；还需独立的选择规则。","Thouless 泵浦可研究几何功转换，但驱动、热库和总熵必须完整记账，不能直接宣布卡诺范式终结。","XENONnT 的零显著超出用于排除参数点，不支持把整个拓扑纲领当成已被实验验证。"]}],"boundary":"对公开理论只作方法与证据审查，不推断私人身份，也不把同名高校科研人员混为同一主体。","nextAction":"优先完成三代计数、冷原子预言和暗物质截面的最小规律包；暂缓意识、曲率泡和热机的跨域升级。","sources":[{"label":"奇偶约束边界","locator":"arxiv.org/pdf/hep-ph/0003303"},{"label":"XENONnT 2025","locator":"ui.adsabs.harvard.edu/abs/2025arXiv250218005A/abstract"},{"label":"几何热机对照","locator":"arxiv.org/html/2505.06851v2"}]}],"sharedRules":["证据状态只能由花园或独立核验流程给出，组件不得本地晋升。","静态 HTML 不含令牌、不执行外部脚本、不实时请求花园。","每次同步生成新快照和 SHA-256，历史失败不得被成功覆盖。","形式证明、数值演示、数据库留出和独立实验复现分别记账。"]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('research-data').textContent);
  let activeId = data.cases[0].id;
  const tabs = document.getElementById('research-tabs');
  const main = document.getElementById('research-main');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  function metricHtml(item){return `<div class="research-metric"><strong class="research-value">${esc(item.value)}</strong><span class="research-label">${esc(item.label)}</span><span class="research-note">${esc(item.note)}</span></div>`;}
  function sectionHtml(section,index){
    const content = `<h3 class="research-section-title">${esc(section.title)}</h3><ul class="research-items">${section.items.map(item => `<li class="research-item">${esc(item)}</li>`).join('')}</ul>`;
    if(index===0) return `<section>${content}</section>`;
    return `<details class="research-details"><summary>${esc(section.title)}</summary>${content}</details>`;
  }
  function renderCase(item){
    const tone = ['positive','warning','danger','accent'].includes(item.tone) ? item.tone : 'accent';
    const sources = (item.sources||[]).map(source => `<li><span class="research-code">${esc(source.label)} · ${esc(source.locator)}</span></li>`).join('');
    main.innerHTML = `<div class="research-status-row"><span class="research-status research-status--${tone}">${esc(item.status)}</span></div>
      <h2 class="research-case-title">${esc(item.title)}</h2><p class="research-summary">${esc(item.summary)}</p>
      <div class="research-metrics">${item.metrics.map(metricHtml).join('')}</div>
      ${item.sections.map(sectionHtml).join('')}
      <div class="research-warning">${esc(item.boundary)}</div>
      <div class="research-next"><span>下一项最有价值的动作</span>${esc(item.nextAction)}</div>
      ${sources ? `<details class="research-details"><summary>来源定位</summary><ul class="research-sources">${sources}</ul></details>` : ''}`;
  }
  function renderTabs(){
    tabs.innerHTML = data.cases.map(item => `<button type="button" class="kimi-chip" data-id="${esc(item.id)}" aria-pressed="${item.id===activeId}">${esc(item.label)}</button>`).join('');
    tabs.querySelectorAll('button').forEach(button => button.addEventListener('click',()=>{activeId=button.dataset.id;renderTabs();renderCase(data.cases.find(item=>item.id===activeId));}));
  }
  renderTabs();
  renderCase(data.cases[0]);
  if(data.sharedRules?.length){
    const rules = document.createElement('div');
    rules.className='research-rules';
    rules.innerHTML=`<details><summary>共享证据纪律</summary><ul>${data.sharedRules.map(rule=>`<li>${esc(rule)}</li>`).join('')}</ul></details>`;
    main.appendChild(rules);
  }
})();
</script>
</body>
