    }).join('');
    const fingerprint = graph.methodFingerprints.find(item => item.documentKey === state.documentKey) || graph.methodFingerprints[0];
    return `<div class="toolbar" role="group" aria-label="显示方式"><button class="kimi-chip" data-view="graph" aria-pressed="true">血缘图</button><button class="kimi-chip" data-view="matrix" aria-pressed="false">方法比较矩阵</button><select class="kimi-select" id="doc-select" aria-label="查看文档方法缺口">${graph.methodFingerprints.map(item => `<option value="${esc(item.documentKey)}" ${item.documentKey === fingerprint?.documentKey ? 'selected' : ''}>${esc(item.documentKey)}</option>`).join('')}</select></div><div class="toolbar" role="group" aria-label="来源角色筛选">${[['all','全部'],['primary','目标原始材料'],['context','外部上下文'],['citation','历史引用']].map(([key,label]) => `<button class="kimi-chip" data-filter="${key}" aria-pressed="${state.filter === key}">${label}</button>`).join('')}</div><svg class="graph" viewBox="0 0 700 365" role="img" aria-label="六篇文档与八条证据的描述关系；外部上下文用虚线单独标记，连线不表示独立实验"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--kimi-color-text-quaternary,#999)"/></marker></defs>${edgeMarkup}${docMarkup}${evidenceMarkup}</svg><div class="legend"><span><i class="mark mark--primary"></i>原始材料</span><span><i class="mark mark--citation"></i>历史引用</span><span><i class="mark mark--context"></i>外部上下文（排除）</span><span>虚线不是独立重复</span></div>${fingerprint ? `<section class="detail"><h2>${esc(fingerprint.documentKey)} · ${esc(statusLabel(fingerprint.status))}</h2><p class="small">已知字段：${fingerprint.knownFields.length ? fingerprint.knownFields.map(esc).join('、') : '无'}。未知字段：${fingerprint.unknownFields.map(esc).join('、')}。</p><p class="small muted">仅目标原始、已核验全文／协议可补入这些字段；当前没有完整协议可用于跨文献比较。</p></section>` : ''}`;
  }
  function matrixView() {
    return `<div class="toolbar" role="group" aria-label="显示方式"><button class="kimi-chip" data-view="graph" aria-pressed="false">血缘图</button><button class="kimi-chip" data-view="matrix" aria-pressed="true">方法比较矩阵</button></div><p class="small muted">${graph.comparisons.length} 组两两比较；匹配候选不等于独立实验，信息不足不能强行合并。</p><div class="table-scroll"><table class="data-table"><thead><tr><th>文档 A</th><th>文档 B</th><th>判定</th><th>依据</th></tr></thead><tbody>${graph.comparisons.map(item => `<tr><td class="code">${esc(item.left)}</td><td class="code">${esc(item.right)}</td><td>${esc(item.verdict === 'insufficient' ? '信息不足' : item.verdict)}</td><td>${esc(item.reason)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function render() { main.innerHTML = state.view === 'graph' ? graphView() : matrixView(); }
  main.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.view) { state.view = button.dataset.view; render(); }
    if (button.dataset.filter) { state.filter = button.dataset.filter; state.view = 'graph'; render(); }
  });
  main.addEventListener('change', event => { if (event.target.id === 'doc-select') { state.documentKey = event.target.value; render(); } });
  document.getElementById('source-list').innerHTML = evidence.map(item => `<article class="source"><span class="badge ${roleOf(item) === 'context' ? 'badge--warning' : ''}">${esc(roleLabels[roleOf(item)])}</span><p class="small"><strong>${esc(shortNames[item.id] || item.id)}</strong> · ${esc(item.level)} · ${esc(item.verification)}<br>${esc(item.locator)}<br>“${esc(item.quote)}”<br><a href="${esc(item.sourceUrl)}" target="_blank" rel="noreferrer noopener">打开来源</a></p></article>`).join('');
  render();
})();
</script></body></html>
