<style>

ce);font-size:12px;overflow-wrap:anywhere}.notice{padding:var(--kimi-space-3,12px);border-inline-start:2px solid var(--kimi-color-warning,#875c00);background:color-mix(in srgb,var(--kimi-color-warning,#875c00) 8%,transparent);font-size:14px;line-height:21px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--kimi-space-3,12px);padding-block:var(--kimi-space-4,16px);border-bottom:1px solid var(--kimi-color-border,#ccc)}.metric{padding-inline-start:var(--kimi-space-3,12px);border-inline-start:1px solid var(--kimi-color-border,#ccc)}.metric:first-child{padding-inline-start:0;border-inline-start:0}.metric-value{display:block;font-size:26px;line-height:32px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.metric-label{display:block;font-size:12px;color:var(--kimi-color-text-secondary,#666)}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:var(--kimi-space-2,8px);margin-block-end:var(--kimi-space-4,16px)}.field{display:grid;gap:var(--kimi-space-1,4px);min-width:128px;flex:1}.field label{font-size:12px;color:var(--kimi-color-text-secondary,#666)}.kimi-input,.kimi-select{width:100%;min-height:36px;padding:var(--kimi-space-2,8px);border:1px solid var(--kimi-color-border,#bbb);border-radius:var(--kimi-radius-input,10px);color:inherit;background:transparent}.kimi-button{min-height:36px;padding:var(--kimi-space-2,8px) var(--kimi-space-3,12px);border:1px solid var(--kimi-color-border,#bbb);border-radius:var(--kimi-radius-button,8px);color:inherit;background:transparent}.kimi-button--primary{color:var(--kimi-color-surface,#fff);background:var(--kimi-color-text-primary,#222);border-color:var(--kimi-color-text-primary,#222)}.chips{display:flex;gap:var(--kimi-space-1,4px);overflow-x:auto;padding-block-end:var(--kimi-space-2,8px)}.kimi-chip{flex:none;min-height:32px;padding:var(--kimi-space-1,4px) var(--kimi-space-2,8px);border:1px solid var(--kimi-color-border,#ccc);border-radius:var(--kimi-radius-chip,6px);color:inherit;background:transparent;font-size:12px}.kimi-chip[aria-pressed=true]{color:var(--kimi-color-surface,#fff);background:var(--kimi-color-text-primary,#222)}.paper-content{max-width:760px;font-size:16px;line-height:1.75;overflow-wrap:anywhere}.paper-content h1{font-size:20px}.paper-content h2{margin-block-start:var(--kimi-space-5,20px)}.paper-content h3{font-size:16px}.paper-content table,.data-table{width:100%;border-collapse:collapse;font-size:13px;line-height:20px}.paper-content th,.paper-content td,.data-table th,.data-table td{padding:var(--kimi-space-2,8px);border-bottom:1px solid var(--kimi-color-border,#ddd);text-align:start;vertical-align:top}.paper-content blockquote{margin-inline:0;padding-inline-start:var(--kimi-space-3,12px);border-inline-start:2px solid var(--kimi-color-border,#bbb);color:var(--kimi-color-text-secondary,#666)}.paper-content pre,.paper-content code{font-family:var(--kimi-font-mono,monospace);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.paper-image{display:block;width:100%;height:auto;margin-block:var(--kimi-space-3,12px);border:1px solid var(--kimi-color-border,#ddd);border-radius:var(--kimi-radius-panel,12px)}.figure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--kimi-space-3,12px)}.figure-card{padding:0;border:0;text-align:start;color:inherit;background:transparent}.figure-card img{display:block;width:100%;height:auto;border:1px solid var(--kimi-color-border,#ddd);border-radius:var(--kimi-radius-input,10px)}.figure-card span{display:block;margin-block-start:var(--kimi-space-1,4px);font-size:12px;overflow-wrap:anywhere}.search-result{display:block;width:100%;padding:var(--kimi-space-3,12px);border:0;border-bottom:1px solid var(--kimi-color-border,#ddd);text-align:start;color:inherit;background:transparent}.search-result small{display:block;color:var(--kimi-color-text-secondary,#666)}.activity-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(100px,3fr) 72px;align-items:center;gap:var(--kimi-space-3,12px);padding-block:var(--kimi-space-3,12px);border-bottom:1px solid var(--kimi-color-border,#ddd)}.bar-track{height:12px;background:color-mix(in srgb,var(--kimi-color-text-quaternary,#999) 18%,transparent);border-radius:var(--kimi-radius-small,4px);overflow:hidden}.bar-fill{height:100%;width:var(--bar);background:var(--kimi-chart-1,#377eb8)}.number{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}.details{margin-block-start:var(--kimi-space-3,12px);border-top:1px solid var(--kimi-color-border,#ddd);padding-block-start:var(--kimi-space-2,8px)}.details summary{cursor:pointer;min-height:32px;padding-block:var(--kimi-space-1,4px)}.diff-list,.clean-list{list-style:none;padding:0;margin:0;display:grid;gap:var(--kimi-space-2,8px)}.diff-list li,.record-card{padding:var(--kimi-space-3,12px);border:1px solid var(--kimi-color-border,#ddd);border-radius:var(--kimi-radius-input,10px)}.table-scroll{overflow-x:auto}.project-card{padding-block:var(--kimi-space-4,16px);border-bottom:1px solid var(--kimi-color-border,#ddd)}.project-card h3{margin:var(--kimi-space-2,8px) 0}.project-card p{margin:var(--kimi-space-2,8px) 0;font-size:14px}.project-meta{display:flex;flex-wrap:wrap;gap:var(--kimi-space-2,8px)}.record-layout{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2fr);gap:var(--kimi-space-4,16px)}.record-list{display:grid;gap:var(--kimi-space-1,4px);align-content:start;max-height:720px;overflow:auto}.record-button{padding:var(--kimi-space-2,8px);border:1px solid var(--kimi-color-border,#ddd);border-radius:var(--kimi-radius-button,8px);text-align:start;color:inherit;background:transparent;overflow-wrap:anywhere}.record-button[aria-pressed=true]{border-color:var(--kimi-color-text-primary,#222);background:color-mix(in srgb,var(--kimi-color-text-primary,#222) 6%,transparent)}.record-detail{min-width:0}.record-detail h2{overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:minmax(100px,1fr) minmax(0,2fr);gap:var(--kimi-space-2,8px);font-size:12px}.fields dt{color:var(--kimi-color-text-secondary,#666);overflow-wrap:anywhere}.fields dd{margin:0;overflow-wrap:anywhere}.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--kimi-space-3,12px)}.checklist li{margin-block-end:var(--kimi-space-2,8px)}.empty{padding:var(--kimi-space-5,20px) 0;color:var(--kimi-color-text-secondary,#666)}.image-dialog{width:min(1100px,92vw);max-height:90vh;padding:var(--kimi-space-3,12px);border:1px solid var(--kimi-color-border,#ccc);border-radius:var(--kimi-radius-panel,12px);color:inherit;background:var(--kimi-color-surface,#fff);overflow:auto}.image-dialog img{display:block;max-width:100%;height:auto;margin-inline:auto}.image-dialog::backdrop{background:color-mix(in srgb,#000 55%,transparent)}
@media(max-width:640px){.explorer-head{display:block}.explorer-head>.badge{margin-block-start:var(--kimi-space-2,8px)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric:nth-child(3){border-inline-start:0;padding-inline-start:0}.figure-grid,.record-layout,.plan-grid{grid-template-columns:1fr}.record-list{max-height:280px}.activity-row{grid-template-columns:minmax(100px,1fr) minmax(80px,2fr) 64px;gap:var(--kimi-space-2,8px);font-size:12px}.paper-content{font-size:15px}}
</style>

<script type="application/json" id="explorer-data">{"kind":"activity","data":{"stability":{"engine":"Cross-document CA I/II sensitivity analysis","version":"snapshot-2026-10-31","document_count":6,"strict_method_matched_count":1,"method_incomplete_count":5,"pairs":[{"document_chembl_id":"CHEMBL1146805","year":2004,"record_id":235477,"ca_i_activity":47559,"ca_ii_activity":47560,"ca_i_ki_nM":250,"ca_ii_ki_nM":12,"ca_i_method":"esterase assay method","ca_ii_method":"esterase assay method","method_status":"explicit_matched","ca_i_duplicate":1,"ca_ii_duplicate":1,"ki_ratio":20.833333333333332},{"document_chembl_id":"CHEMBL1133556","year":2000,"record_id":282506,"ca_i_activity":49652,"ca_ii_activity":49653,"ca_i_ki_nM":900,"ca_ii_ki_nM":12,"ca_i_method":"not specified in assay description","ca_ii_method":"not specified in assay description","method_status":"method_incomplete","ca_i_duplicate":1,"ca_ii_duplicate":1,"ki_ratio":75},{"document_chembl_id":"CHEMBL1146697","year":2004,"record_id":136210,"ca_i_activity":80687,"ca_ii_activity":80688,"ca_i_ki_nM":900,"ca_ii_ki_nM":12,"ca_i_method":"not specified in assay description","ca_ii_method":"not specified in assay description","method_status":"method_incomplete","ca_i_duplicate":1,"ca_ii_duplicate":1,"ki_ratio":75},{"document_chembl_id":"CHEMBL1136178","year":2003,"record_id":180522,"ca_i_activity":106505,"ca_ii_activity":106506,"ca_i_ki_nM":200,"ca_ii_ki_nM":7,"ca_i_method":"not specified in assay description","ca_ii_method":"not specified in assay description","method_status":"method_incomplete","ca_i_duplicate":0,"ca_ii_duplicate":0,"ki_ratio":28.571428571428573},{"document_chembl_id":"CHEMBL1146695","year":2004,"record_id":126435,"ca_i_activity":151872,"ca_ii_activity":151873,"ca_i_ki_nM":250,"ca_ii_ki_nM":12,"ca_i_method":"not specified in assay description","ca_ii_method":"not specified in assay description","method_status":"method_incomplete","ca_i_duplicate":1,"ca_ii_duplicate":1,"ki_ratio":20.833333333333332},{"document_chembl_id":"CHEMBL1134204","year":2001,"record_id":302270,"ca_i_activity":288595,"ca_ii_activity":288596,"ca_i_ki_nM":900,"ca_ii_ki_nM":12,"ca_i_method":"not specified in assay description","ca_ii_method":"not specified in assay description","method_status":"method_incomplete","ca_i_duplicate":1,"ca_ii_duplicate":1,"ki_ratio":75}],"ratio_min":20.833333333333332,"ratio_max":75,"max_min_fold":3.6,"stability_conclusion":"not_supported_as_stable_point_estimate","meta_analysis_performed":false,"status":"verified","scope":"六组文档的表观 Ki 比值从 20.8333 到 75，极差倍数为 3.6；仅一组明确同酯酶方法，其余方法信息不足，不能据此合并成普适选择性常数。不同文档和重复标记也不保证实验独立。"},"selectivity":{"engine":"ChEMBL method-aware selectivity analysis","version":"snapshot-2026-10-31","molecule_chembl_id":"CHEMBL20","document_chembl_id":"CHEMBL1146805","record_id":235477,"independence":"同一文档、同一 record_id；三条记录不是独立重复实验","ca_i":{"activity_id":47559,"ki_nM":250,"pchembl":6.6,"assay_method":"esterase assay method","potential_duplicate":1},"ca_ii":{"activity_id":47560,"ki_nM":12,"pchembl":7.92,"assay_method":"esterase assay method","potential_duplicate":1},"ca_ix":{"activity_id":47561,"ki_nM":25,"pchembl":7.6,"assay_method":"CO2 hydrase assay method","potential_duplicate":1},"matched_comparison":"CA I 与 CA II 均为 esterase assay；Ki 单位均为 nM","ca_i_ii_ki_ratio":20.833333333333332,"ca_ii_minus_ca_i_pchembl_delta":1.3187587626244124,"ca_ix_comparison":"方法为 CO2 hydrase assay，不与 esterase 结果合并计算选择性比或统一排名","ca_ix_ratio_computed":false,"status":"verified","scope":"CA I/II 的 250/12=20.8333 是同一文档、同一酯酶方法下的表观 Ki 比值，提示而非证明普遍选择性；无重复实验统计、置信区间或临床外推。CA IX 因方法不同仅单列。potential_duplicate=1 全部保留。"}}}</script>
<script>
(() => {
  const {kind,data} = JSON.parse(document.getElementById('explorer-data').textContent);
  const main = document.getElementById('explorer-main');
  const nf = new Intl.NumberFormat('zh-CN');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const metric = (value,label) => `<div class="metric"><strong class="metric-value">${esc(value)}</strong><span class="metric-label">${esc(label)}</span></div>`;
  const badge = (text,kind='') => `<span class="badge${kind?` badge--${kind}`:''}">${esc(text)}</span>`;
  const empty = text => `<p class="empty">${esc(text)}</p>`;
  const state = {paper:0,section:0,query:'',figures:false,matched:false,visible:12,projectQuery:'',domain:'all',adoption:'all',localStatus:'all',selected:null,recordQuery:'',evidence:'all',recordDomain:'all',budget:null};
  function openImage(src,caption){
    const dialog = document.getElementById('image-dialog');
    document.getElementById('dialog-image').src = src;
    document.getElementById('dialog-image').alt = caption;
    document.getElementById('dialog-caption').textContent = caption;
    dialog.showModal();
  }
  document.getElementById('close-image').addEventListener('click',()=>document.getElementById('image-dialog').close());
  document.getElementById('image-dialog').addEventListener('click',event=>{if(event.target.id==='image-dialog')event.target.close();});
  function figureGrid(figures){return `<div class="figure-grid">${figures.map(figure=>`<button type="button" class="figure-card" data-image="${esc(figure.src)}" data-caption="${esc(figure.alt)}"><img src="${esc(figure.src)}" alt="${esc(figure.alt)}" loading="lazy"><span class="code">${esc(figure.filename)}</span></button>`).join('')}</div>`;}
  function renderPapers(){
    const paper = data.papers[state.paper];
    const section = paper.sections[state.section] || paper.sections[0];
    const matches = state.query ? paper.sections.map((item,index)=>({item,index})).filter(({item})=>`${item.title} ${item.text}`.toLowerCase().includes(state.query.toLowerCase())) : [];
    let content;
    if(state.figures) content = `<h2>${esc(paper.title)} · ${paper.figures.length} 幅图</h2>${figureGrid(paper.figures)}`;
    else if(state.query) content = `<h2>“${esc(state.query)}”的章节结果</h2><p class="muted small">找到 ${matches.length} 个章节；检索标题和正文，不修改原文。</p>${matches.length?matches.map(({item,index})=>`<button type="button" class="search-result" data-section="${index}"><strong>${esc(item.title)}</strong><small>${esc(item.text.slice(0,220))}${item.text.length>220?'……':''}</small></button>`).join(''):empty('本篇没有匹配章节，可缩短关键词。')}`;
    else content = `<nav class="chips" aria-label="论文章节">${paper.sections.map((item,index)=>`<button type="button" class="kimi-chip" data-section="${index}" aria-pressed="${index===state.section}">${esc(item.title)}</button>`).join('')}</nav><article class="paper-content">${section.html}</article>`;
    main.innerHTML = `<form class="toolbar" data-form="paper-search"><div class="field"><label for="paper-select">选择论文</label><select class="kimi-select" id="paper-select" name="paper">${data.papers.map((item,index)=>`<option value="${index}" ${index===state.paper?'selected':''}>${esc(item.title)}</option>`).join('')}</select></div><div class="field"><label for="paper-query">本篇全文检索</label><input class="kimi-input" id="paper-query" name="query" value="${esc(state.query)}" placeholder="例如：独立重复"></div><button class="kimi-button kimi-button--primary" type="submit">查找章节</button><button class="kimi-button" type="button" data-action="figures">${state.figures?'返回正文':'查看图件'}</button></form><p>${badge(data.status,'warning')}</p>${content}`;
  }
  function activityDetails(pair){
    return `<details class="details"><summary>${esc(pair.document_chembl_id)} · ${esc(pair.year)} · activity ${esc(pair.ca_i_activity)}/${esc(pair.ca_ii_activity)}</summary><div class="table-scroll"><table class="data-table"><thead><tr><th>靶点</th><th>Ki（nM）</th><th>方法</th><th>重复标记</th></tr></thead><tbody><tr><td>CA I</td><td class="number">${esc(pair.ca_i_ki_nM)}</td><td>${esc(pair.ca_i_method)}</td><td>${esc(pair.ca_i_duplicate)}</td></tr><tr><td>CA II</td><td class="number">${esc(pair.ca_ii_ki_nM)}</td><td>${esc(pair.ca_ii_method)}</td><td>${esc(pair.ca_ii_duplicate)}</td></tr></tbody></table></div><p class="small">record_id：${esc(pair.record_id)}。该比值仅属于此文档内的表观配对，不是独立重复统计。</p></details>`;
  }
  function renderActivity(){
    const d = data.stability;
    const pairs = d.pairs.filter(pair=>!state.matched || pair.method_status==='explicit_matched');
    const ix = data.selectivity.ca_ix;
    main.innerHTML = `<div class="metrics">${metric(d.document_count,'文档内配对')}${metric(`${Number(d.ratio_min.toFixed(4))}–${d.ratio_max}`,'表观 Ki 比值')}${metric(`${d.max_min_fold} 倍`,'观察极差')}${metric(`${d.strict_method_matched_count}/${d.document_count}`,'明确同酯酶方法')}</div><p class="notice">${esc(d.scope)}</p><div class="toolbar"><label><input type="checkbox" id="matched-only" ${state.matched?'checked':''}> 仅显示明确同酯酶方法</label></div><h2>CA I Ki ÷ CA II Ki</h2>${pairs.length?pairs.map(pair=>`<div class="activity-row"><div><strong>${esc(pair.document_chembl_id)}</strong><div class="small muted">${pair.method_status==='explicit_matched'?'明确同方法':'方法信息不足'}</div></div><div class="bar-track" role="img" aria-label="表观比值 ${esc(pair.ki_ratio.toFixed(4))}，六组最大值为 75"><div class="bar-fill" style="--bar:${(pair.ki_ratio/d.ratio_max*100).toFixed(3)}%"></div></div><span class="number">${esc(pair.ki_ratio.toFixed(4))}</span></div>${activityDetails(pair)}`).join(''):empty('当前筛选没有记录。')}<details class="details"><summary>CA IX 单列：不同方法，不计算统一选择性比</summary><p>CA IX Ki = <strong>${esc(ix.ki_nM)} nM</strong>；方法为 ${esc(ix.assay_method)}；pChEMBL ${esc(ix.pchembl)}；potential_duplicate=${esc(ix.potential_duplicate)}。</p><p class="small">${esc(data.selectivity.ca_ix_comparison)}。CA I/II 的 ΔpChEMBL=${esc(data.selectivity.ca_ii_minus_ca_i_pchembl_delta)}，仅对应同文档同酯酶配对。</p></details><p class="small muted">未进行中位数或荟萃合并估计；重复标记不作为剔除或造假证据。</p>`;
  }
  function renderStructure(){
    const d=data;
    const labels={terminal_deletion:'起始甲硫氨酸缺失',substitution:'H94N 替换',insertion:'参考位置 200 后插入 P'};
    main.innerHTML=`<div class="metrics">${metric(`${d.reference.pdb_id} · ${d.reference.resolution_A} Å`,'野生型参考结构')}${metric(`${d.control.pdb_id} · ${d.control.resolution_A} Å`,'不同构建对照')}${metric(d.alignment_difference_event_count,'三类序列差异')}${metric(`${d.sequence_string_length}/${d.metadata_sample_sequence_length}`,'序列长度／元数据长度')}</div><p class="notice">${esc(d.scope)}</p><h2>逐项差异</h2><ul class="diff-list">${d.sequence_differences.map(diff=>`<li><strong>${esc(labels[diff.type]||diff.type)}</strong><p class="small">参考：${esc(diff.reference)}<br>对照：${esc(diff.control)}${diff.position?`<br>位置：${esc(diff.position)}`:''}${diff.after_reference_position?`<br>位于参考位置 ${esc(diff.after_reference_position)} 之后`:''}</p></li>`).join('')}</ul><p class="small">${esc(d.shared)}。exact_wildtype_replication = <code>${esc(d.exact_wildtype_replication)}</code>。</p><details class="details"><summary>查看完整对齐区间与排除候选</summary><div class="table-scroll"><table class="data-table"><thead><tr><th>操作</th><th>参考索引</th><th>对照索引</th></tr></thead><tbody>${d.alignment_opcodes.map(op=>`<tr><td class="code">${esc(op[0])}</td><td class="number">${esc(op[1])}–${esc(op[2])}</td><td class="number">${esc(op[3])}–${esc(op[4])}</td></tr>`).join('')}</tbody></table></div><p class="small muted">索引采用 Python 切片约定，右端不包含；插入区间的解释以逐项差异为准。</p><h3>排除候选</h3><ul>${d.excluded_candidates.map(item=>`<li><code>${esc(item.pdb_id)}</code>：${esc(item.reason)}</li>`).join('')}</ul></details><p class="small">参考 DOI：${esc(d.reference.primary_citation_doi)}<br>对照 DOI：${esc(d.control.primary_citation_doi)}<br>采集日期：${esc(d.reference.data_collection_date)}／${esc(d.control.data_collection_date)}</p>`;
  }
  const domainLabels={national:'国家计划',biology:'生物',math:'数学',science:'科学智能',physics:'物理',infrastructure:'基础设施',chemistry:'化学',cross:'跨域'};
  function renderProjects(){
    const filtered=data.projects.filter(project=>(state.domain==='all'||project.domain===state.domain)&&(state.adoption==='all'||project.adoption===state.adoption)&&(state.localStatus==='all'||project.localStatus===state.localStatus)&&(!state.projectQuery||`${project.name} ${project.owner} ${project.collaboration} ${project.notes}`.toLowerCase().includes(state.projectQuery.toLowerCase())));
    const shown=filtered.slice(0,state.visible);
    const options=(key,labels)=>[...new Set(data.projects.map(item=>item[key]))].map(value=>`<option value="${esc(value)}" ${state[key]===value?'selected':''}>${esc(labels?.[value]||value)}（${data.projects.filter(item=>item[key]===value).length}）</option>`).join('');
    main.innerHTML=`<div class="metrics">${metric(data.projects.length,'公开项目条目')}${metric(data.projects.filter(item=>item.localStatus==='verified').length,'本机轻量复核')}${metric(data.projects.filter(item=>item.adoption==='P1_adapt').length,'优先适配')}${metric(data.projects.filter(item=>item.adoption==='P3_external').length,'外部协作')}</div><p class="notice">${esc(data.scope)}本地 verified 仅指特定轻量检查，不代表完整项目、模型或结论已验证。</p><form class="toolbar" data-form="project-filter"><div class="field"><label for="project-query">名称、机构或协作方向</label><input class="kimi-input" id="project-query" name="query" value="${esc(state.projectQuery)}" placeholder="例如：证明、材料、虚拟细胞"></div><div class="field"><label for="project-domain">领域</label><select class="kimi-select" id="project-domain" name="domain"><option value="all">全部领域</option>${options('domain',domainLabels)}</select></div><div class="field"><label for="project-adoption">采用层级</label><select class="kimi-select" id="project-adoption" name="adoption"><option value="all">全部层级</option>${options('adoption')}</select></div><div class="field"><label for="project-status">本地状态</label><select class="kimi-select" id="project-status" name="localStatus"><option value="all">全部状态</option>${options('localStatus')}</select></div><button class="kimi-button kimi-button--primary" type="submit">筛选项目</button></form><p class="muted small">匹配 ${filtered.length} 项；显示 ${shown.length} 项。P0_local 本机轻量 · P1_adapt 优先适配 · P2_watch 观察 · P3_external 外部协作。</p>${shown.length?shown.map(project=>`<article class="project-card"><div class="project-meta">${badge(domainLabels[project.domain]||project.domain)}${badge(project.adoption,project.localStatus==='verified'?'positive':'')}${badge(project.localStatus)}</div><h3>${esc(project.name)}</h3><p class="small muted">${esc(project.owner)} · ${esc(project.kind)} · 来源层级 ${esc(project.evidenceTier)}</p><p><strong>协作切入点：</strong>${esc(project.collaboration)}</p><details class="details"><summary>边界、备注与来源定位</summary><p class="small">${esc(project.notes)}</p><p class="code">${esc(project.source)}</p><p class="code">${esc(project.id)}</p></details></article>`).join(''):empty('没有匹配项目，请减少筛选条件。')}${filtered.length>shown.length?`<div class="toolbar"><button class="kimi-button" data-action="more-projects" type="button">再显示 ${Math.min(24,filtered.length-shown.length)} 项</button></div>`:''}`;
  }
  function renderValidation(){
    const filtered=data.records.filter(record=>(state.recordDomain==='all'||record.domain===state.recordDomain)&&(state.evidence==='all'||record.evidenceKind===state.evidence)&&(!state.recordQuery||`${record.engine} ${record.file} ${record.scope}`.toLowerCase().includes(state.recordQuery.toLowerCase())));
    if(!filtered.some(item=>item.id===state.selected))state.selected=filtered[0]?.id||null;
    const record=filtered.find(item=>item.id===state.selected);
    main.innerHTML=`<div class="metrics">${metric(data.records.length,'验证与上游快照')}${metric(data.records.filter(item=>item.evidenceKind==='executed').length,'已执行指定复核')}${metric(data.records.filter(item=>item.evidenceKind==='upstream').length,'上游原始快照')}${metric(new Set(data.records.filter(item=>item.script).map(item=>item.script)).size,'关联重放脚本')}</div><p class="notice">${esc(data.note)}</p><form class="toolbar" data-form="record-filter"><div class="field"><label for="record-query">引擎、文件或证据边界</label><input class="kimi-input" id="record-query" name="query" value="${esc(state.recordQuery)}" placeholder="例如：RDKit、P00918"></div><div class="field"><label for="record-domain">领域</label><select class="kimi-select" id="record-domain" name="domain"><option value="all">全部领域</option>${['math','physics','chemistry','biology','cross'].map(value=>`<option value="${value}" ${state.recordDomain===value?'selected':''}>${domainLabels[value]}</option>`).join('')}</select></div><div class="field"><label for="record-evidence">证据类型</label><select class="kimi-select" id="record-evidence" name="evidence"><option value="all">全部类型</option><option value="executed" ${state.evidence==='executed'?'selected':''}>已执行指定复核</option><option value="upstream" ${state.evidence==='upstream'?'selected':''}>上游原始快照</option></select></div><button class="kimi-button kimi-button--primary" type="submit">筛选快照</button></form><p class="small muted">当前 ${filtered.length} 份。原始记录不自动升级为计算验证；重放需在 frontier-breakthrough 的对应隔离环境中进行。</p><div class="record-layout"><div class="record-list">${filtered.map(item=>`<button class="record-button" type="button" data-record="${esc(item.id)}" aria-pressed="${item.id===state.selected}"><strong>${esc(item.engine)}</strong><br><span class="code">${esc(item.file)}</span></button>`).join('')}</div><section class="record-detail">${record?`<div class="project-meta">${badge(domainLabels[record.domain])}${badge(record.evidenceKind==='executed'?'已执行指定复核':'上游原始快照',record.evidenceKind==='executed'?'positive':'')}</div><h2>${esc(record.engine)}</h2><p class="code">${esc(record.file)} · ${esc(record.version)}</p><p class="small">SHA-256：${esc(record.sha256)}</p><p>${esc(record.scope)}</p><h3>标量记录</h3><dl class="fields">${record.fields.map(([key,value])=>`<dt class="code">${esc(key)}</dt><dd>${esc(value)}</dd>`).join('')}</dl><div class="notice"><strong>重放路径</strong><p>${record.script?`<code>python scripts/${esc(record.script)}</code>`:'该文件是原始上游快照，没有单独的重算脚本；应通过依赖它的核验脚本重放。'}</p><p class="small">浏览器未执行该脚本。运行前需固定原始输入、软件版本和依赖环境，并复核输出而非仅看进程退出成功。</p></div>`:empty('没有匹配快照。')}</section></div><p class="small"><a href="../../snapshots/validation-records.json">查看完整只读快照包</a></p>`;
  }
  function renderReferences(){
    if(state.refPaper===undefined)Object.assign(state,{refPaper:'all',refStatus:'all',refQuery:'',refVisible:12});
    const statusLabels={metadata_matched:'DOI／目录元数据匹配',local_version_matched:'本地版本匹配',record_snapshot_matched:'数据库快照覆盖',local_evidence_present:'本地证据文件齐全',record_snapshot_partial:'部分记录有快照',local_evidence_missing:'本地证据缺项',version_mismatch:'版本不一致',metadata_mismatch:'元数据不一致',source_locator_only:'仅来源定位'};
    const kindLabels={scholarly:'学术文献',software:'软件',database_record:'数据库记录',local_evidence:'本地证据'};
    const filtered=data.references.filter(ref=>(state.refPaper==='all'||ref.paperId===state.refPaper)&&(state.refStatus==='all'||ref.status===state.refStatus)&&(!state.refQuery||`${ref.raw} ${ref.metadata?.title||''} ${ref.identifiers.join(' ')}`.toLowerCase().includes(state.refQuery.toLowerCase())));
    const shown=filtered.slice(0,state.refVisible);
    main.innerHTML=`<div class="metrics">${metric(data.references.length,'逐条书目')}${metric(data.statusCounts.metadata_matched||0,'DOI／目录元数据')}${metric(data.statusCounts.record_snapshot_matched||0,'数据库快照覆盖')}${metric(data.statusCounts.local_evidence_present||0,'本地证据齐全')}</div><p class="notice">${esc(data.scope)}</p><details class="details"><summary>书目修订与三篇论文的引用方式</summary><p class="small">${esc(data.repair.note)}</p>${data.papers.map(paper=>`<p class="small"><strong>第 ${esc(paper.id)} 篇</strong>：${esc(paper.referenceCount)} 条书目；正文数字编号引用 ${esc(paper.explicitCitationCount)} 处。${paper.explicitCitationCount===0?'编号仅出现在参考文献表，不据此伪造正文引用链接。':''}</p>`).join('')}</details><form class="toolbar" data-form="reference-filter"><div class="field"><label for="reference-query">条目、DOI 或数据库标识</label><input class="kimi-input" id="reference-query" name="query" value="${esc(state.refQuery)}" placeholder="例如：PySINDy、3HS4、FAIR"></div><div class="field"><label for="reference-paper">论文</label><select class="kimi-select" id="reference-paper" name="paper"><option value="all">全部论文</option>${data.papers.map(paper=>`<option value="${esc(paper.id)}" ${state.refPaper===paper.id?'selected':''}>第 ${esc(paper.id)} 篇（${paper.referenceCount} 条）</option>`).join('')}</select></div><div class="field"><label for="reference-status">核验层级</label><select class="kimi-select" id="reference-status" name="status"><option value="all">全部层级</option>${Object.keys(statusLabels).filter(status=>data.references.some(ref=>ref.status===status)).map(status=>`<option value="${status}" ${state.refStatus===status?'selected':''}>${statusLabels[status]}（${data.statusCounts[status]||0}）</option>`).join('')}</select></div><button class="kimi-button kimi-button--primary" type="submit">筛选来源</button></form><p class="small muted">匹配 ${filtered.length} 条；显示 ${shown.length} 条。每条均保留原文，不用注册题名悄悄替换原始条目。</p>${shown.length?shown.map(ref=>`<article class="project-card"><div class="project-meta">${badge(`第 ${ref.paperId} 篇 · [${ref.number}]`)}${badge(kindLabels[ref.kind]||ref.kind)}${badge(statusLabels[ref.status]||ref.status,ref.status.endsWith('_matched')||ref.status==='local_evidence_present'?'positive':'warning')}</div><p>${esc(ref.raw)}</p>${ref.metadata?`<details class="details" open><summary>注册元数据：${esc(ref.metadata.registry)}</summary><p class="small"><strong>${esc(ref.metadata.title)}</strong><br>${esc(ref.metadata.authors.join(', '))}${ref.metadata.authorCount>6?` 等 ${ref.metadata.authorCount} 位作者`:''}<br>${esc(ref.metadata.venue)} · ${esc(ref.metadata.year)} · ${esc(ref.metadata.type)}</p>${ref.metadata.doi?`<p class="code">DOI：${esc(ref.metadata.doi)}</p>`:''}<p class="small"><a href="${esc(ref.metadata.sourceUrl)}" target="_blank" rel="noreferrer noopener">打开元数据来源</a> · 仅核对书目，不表示已读全文</p></details>`:''}<p class="small"><strong>正文关联：</strong>${ref.linkedSections.length?ref.linkedSections.map(section=>`${esc(section.title)}（${section.linkage==='author_year'?'作者—年份':'标识符'}）`).join('；'):'未发现可靠的自动关联章节，仅保留书目条目。'}</p>${ref.identifiers.length?`<p class="code">${esc(ref.identifiers.join(' · '))}</p>`:''}${ref.localFiles.length?`<details class="details"><summary>本地证据文件与 SHA-256</summary>${ref.localFiles.map(file=>`<p class="small"><code>${esc(file.file)}</code><br>${file.present?`SHA-256：${esc(file.sha256)}${file.script?`<br>重放脚本：<code>${esc(file.script)}</code>`:''}`:'未找到对应快照'}</p>`).join('')}</details>`:''}${ref.url?`<p class="small"><a href="${esc(ref.url)}" target="_blank" rel="noreferrer noopener">打开来源定位</a></p>`:''}</article>`).join(''):empty('没有匹配来源，请减少筛选条件。')}${filtered.length>shown.length?`<div class="toolbar"><button class="kimi-button" type="button" data-action="more-projects">再显示 ${Math.min(24,filtered.length-shown.length)} 条</button></div>`:''}<p class="small"><a href="../../snapshots/reference-audit.json">查看完整来源审计快照</a></p>`;
  }
  function normalizeBudget(form){
    const value=name=>Number(form.get(name));
    const plan={total:value('total'),target:value('target'),segment:value('segment'),timeout:value('timeout'),retries:value('retries'),resume:form.get('resume')==='on'};
    for(const key of ['total','target','segment'])if(!Number.isInteger(plan[key])||plan[key]<1||plan[key]>data.maxTotalOutputBudget)throw new Error('预算、目标和单段上限必须是 1 至 1 亿之间的整数。');
    if(plan.target>plan.total||plan.segment>plan.total)throw new Error('目标输出和单段上限都不能超过累计总预算。');
    if(!Number.isInteger(plan.timeout)||plan.timeout<data.minTimeoutMs||plan.timeout>data.maxTimeoutMs)throw new Error('单段超时必须在 1000–3600000 ms 之间。');
    if(!Number.isInteger(plan.retries)||plan.retries<0||plan.retries>data.maxRetries)throw new Error('重试次数必须是 0–10 的整数。');
    plan.count=Math.ceil(plan.target/plan.segment);
    return plan;
  }
  function renderBudget(){
    const plan=state.budget||{total:data.maxTotalOutputBudget,target:data.defaultTargetTokens,segment:data.defaultSegmentMaxTokens,timeout:data.defaultTimeoutMs,retries:2,resume:true,count:1};
    const indexes=[...new Set([0,1,2,3,plan.count-1].filter(index=>index>=0&&index<plan.count))];
    main.innerHTML=`<p class="notice">1 亿 token 是应用层累计总预算，不是模型单次返回承诺。本工具只计算计划，不调用模型、不写检查点、不估算免费额度。</p><form data-form="budget"><div class="plan-grid"><div class="field"><label for="budget-total">累计总预算（token）</label><input class="kimi-input" id="budget-total" name="total" type="number" min="1" max="${data.maxTotalOutputBudget}" step="1" value="${plan.total}" required></div><div class="field"><label for="budget-target">本次目标输出（token）</label><input class="kimi-input" id="budget-target" name="target" type="number" min="1" step="1" value="${plan.target}" required></div><div class="field"><label for="budget-segment">单次分段上限（token）</label><input class="kimi-input" id="budget-segment" name="segment" type="number" min="1" step="1" value="${plan.segment}" required></div><div class="field"><label for="budget-timeout">单段超时（ms）</label><input class="kimi-input" id="budget-timeout" name="timeout" type="number" min="1000" max="3600000" step="1000" value="${plan.timeout}" required></div><div class="field"><label for="budget-retries">每段最多重试次数</label><input class="kimi-input" id="budget-retries" name="retries" type="number" min="0" max="10" step="1" value="${plan.retries}" required></div><label><input type="checkbox" name="resume" ${plan.resume?'checked':''}> 启用指纹匹配后的断点恢复</label></div><div class="toolbar"><button class="kimi-button kimi-button--primary" type="submit">计算分段计划</button></div></form><div id="budget-result">${state.error?`<p class="notice">${esc(state.error)}</p>`:`<div class="metrics">${metric(nf.format(plan.count),'计划分段数')}${metric(nf.format(plan.target),'目标输出 token')}${metric(nf.format(plan.segment),'单段上限 token')}${metric(nf.format(plan.count*(plan.retries+1)),'最大计划调用数（含重试）')}</div><h2>检查点写入顺序</h2><ol class="checklist">${indexes.map(index=>`<li>第 ${nf.format(index+1)} 段：本段预算 ${nf.format(Math.min(plan.segment,plan.target-index*plan.segment))} token；真实生成成功后原子保存，再进入下一段。</li>`).join('')}</ol><p class="small muted">仅列出首尾示例，不为 1 亿预算预生成数千个空调用。末段余量 ${nf.format(plan.target-(plan.count-1)*plan.segment)} token；实际用量以模型返回的 usage 聚合为准。</p><p class="code">${esc(data.checkpointPattern)}</p><ul class="checklist">${data.boundaries.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`}</div>`;
  }
  function render(){if(kind==='papers')renderPapers();else if(kind==='activity')renderActivity();else if(kind==='structure')renderStructure();else if(kind==='projects')renderProjects();else if(kind==='validation')renderValidation();else if(kind==='references')renderReferences();else if(kind==='budget')renderBudget();else main.textContent='未知组件类型';}
  main.addEventListener('submit',event=>{
    event.preventDefault();
    const form=new FormData(event.target);
    if(event.target.dataset.form==='paper-search'){state.paper=Number(form.get('paper'));state.section=0;state.query=String(form.get('query')||'').trim();state.figures=false;renderPapers();}
    if(event.target.dataset.form==='project-filter'){state.projectQuery=String(form.get('query')||'').trim();state.domain=String(form.get('domain'));state.adoption=String(form.get('adoption'));state.localStatus=String(form.get('localStatus'));state.visible=12;renderProjects();}
    if(event.target.dataset.form==='record-filter'){state.recordQuery=String(form.get('query')||'').trim();state.recordDomain=String(form.get('domain'));state.evidence=String(form.get('evidence'));renderValidation();}
    if(event.target.dataset.form==='reference-filter'){state.refQuery=String(form.get('query')||'').trim();state.refPaper=String(form.get('paper'));state.refStatus=String(form.get('status'));state.refVisible=12;renderReferences();}
    if(event.target.dataset.form==='budget'){try{state.budget=normalizeBudget(form);state.error=null;}catch(error){state.error=error.message;}renderBudget();}
  });
  main.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.section!==undefined){state.section=Number(target.dataset.section);state.query='';state.figures=false;renderPapers();}
    if(target.dataset.action==='figures'){state.figures=!state.figures;state.query='';renderPapers();}
    if(target.dataset.action==='more-projects'){if(kind==='references'){state.refVisible+=24;renderReferences();}else{state.visible+=24;renderProjects();}}
    if(target.dataset.record){state.selected=target.dataset.record;renderValidation();}
    if(target.dataset.image)openImage(target.dataset.image,target.dataset.caption||'研究图件');
  });
  main.addEventListener('change',event=>{if(event.target.id==='matched-only'){state.matched=event.target.checked;renderActivity();}});
  render();
})();
</script>
